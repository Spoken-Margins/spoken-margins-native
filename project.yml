name: SpokenMarginsNative
options:
  bundleIdPrefix: com.spokenmargins
  deploymentTarget:
    iOS: "18.0"
packages:
  SessionKit:
    path: Packages/SessionKit
targets:
  SpokenMarginsApp:
    type: application
    platform: iOS
    sources:
      - path: App/SpokenMarginsApp/Sources
        excludes:
          - SpokenMarginsApp/Gate3WatchConnectivityController.swift
          - SpokenMarginsApp/WatchPackageRenderCoordinator.swift
      - path: App/Gate2Shared/Sources
      - path: App/SharedSources
      - path: App/SpokenMarginsApp/Resources/Supertonic
        type: folder
        buildPhase: resources
      - path: App/SpokenMarginsApp/Resources/Legal
        type: folder
        buildPhase: resources
      - path: Contracts/fixtures
        type: folder
      - path: Contracts/traces
        type: folder
    dependencies:
      - target: SpokenMarginsGate2Widget
      - target: SpokenMarginsShareExtension
      - target: SpokenMarginsBrowserTextExtension
      - package: SessionKit
        product: SessionKit
      - package: SessionKit
        product: SessionKitPersistence
      - package: SessionKit
        product: SessionKitAudio
      - package: SessionKit
        product: SessionKitAI
      - package: SessionKit
        product: SessionKitSupertonic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsApp/SpokenMarginsApp.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "12"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        INFOPLIST_FILE: App/SpokenMarginsApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Spoken Margins
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: "0.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    postBuildScripts:
      - name: Remove Embedded Static ONNX Runtime
        script: |
          "${SRCROOT}/scripts/remove-embedded-static-onnxruntime.sh"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/onnxruntime.framework/onnxruntime
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/onnxruntime.framework/onnxruntime
        outputFiles:
          - $(DERIVED_FILE_DIR)/remove-embedded-static-onnxruntime.stamp
        basedOnDependencyAnalysis: false
    info:
      path: App/SpokenMarginsApp/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: SpokenMarginsCompactControls
            CFBundleURLSchemes:
              - spokenmargins
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        SMRemoteProviderExperienceEnabled: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Spoken Margins records spoken interjections during listening sessions.
        NSSpeechRecognitionUsageDescription: Spoken Margins may transcribe spoken interjections when enabled.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  SpokenMarginsGate2Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsGate2Widget/Sources
      - path: App/Gate2Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.gate2widget
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsGate2Widget/SpokenMarginsGate2Widget.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "12"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        ENABLE_DEBUG_DYLIB: NO
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
    info:
      path: App/SpokenMarginsGate2Widget/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins Controls
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SpokenMarginsBrowserTextExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsBrowserTextExtension/Sources
      - path: App/SpokenMarginsBrowserTextExtension/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.browsertext
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsBrowserTextExtension/SpokenMarginsBrowserTextExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "12"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_FILE: App/SpokenMarginsBrowserTextExtension/Info.plist
        MARKETING_VERSION: "0.1"
        SDKROOT: iphoneos
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  SpokenMarginsShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsShareExtension/Sources
      - path: App/SpokenMarginsShareExtension/Resources
      - path: App/Gate2Shared/Sources
        excludes:
          - Gate2CompactCommandQueue.swift
          - Gate2CompactCommandURL.swift
          - Gate2LiveActivityAttributes.swift
      - path: App/SharedSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.share
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsShareExtension/SpokenMarginsShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "12"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_FILE: App/SpokenMarginsShareExtension/Info.plist
        MARKETING_VERSION: "0.1"
        SDKROOT: iphoneos
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/SpokenMarginsShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SourceLinkShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: SourceLinkPreprocessor
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
              NSExtensionActivationSupportsAttachmentsWithMinCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
  SpokenMarginsLegacy:
    type: application
    platform: iOS
    sources:
      - path: App/SpokenMarginsApp/Sources
        excludes:
          - SpokenMarginsApp/Gate3WatchConnectivityController.swift
          - SpokenMarginsApp/WatchPackageRenderCoordinator.swift
      - path: App/Gate2Shared/Sources
      - path: App/SharedSources
      - path: App/SpokenMarginsApp/Resources/Supertonic
        type: folder
        buildPhase: resources
      - path: App/SpokenMarginsApp/Resources/Legal
        type: folder
        buildPhase: resources
      - path: Contracts/fixtures
        type: folder
      - path: Contracts/traces
        type: folder
    dependencies:
      - target: SpokenMarginsLegacyShareExtension
      - target: SpokenMarginsLegacyBrowserTextExtension
      - package: SessionKit
        product: SessionKit
      - package: SessionKit
        product: SessionKitPersistence
      - package: SessionKit
        product: SessionKitAudio
      - package: SessionKit
        product: SessionKitAI
      - package: SessionKit
        product: SessionKitSupertonic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.legacy
        PRODUCT_NAME: SpokenMarginsLegacy
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsLegacy/SpokenMarginsLegacy.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "12"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        INFOPLIST_FILE: App/SpokenMarginsLegacy/Info.plist
        MARKETING_VERSION: "0.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPOKEN_MARGINS_LEGACY"
        IPHONEOS_DEPLOYMENT_TARGET: "16.7"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          "IPHONEOS_DEPLOYMENT_TARGET[sdk=iphonesimulator*]": "16.4"
    postBuildScripts:
      - name: Remove Embedded Static ONNX Runtime
        script: |
          "${SRCROOT}/scripts/remove-embedded-static-onnxruntime.sh"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/onnxruntime.framework/onnxruntime
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/onnxruntime.framework/onnxruntime
        outputFiles:
          - $(DERIVED_FILE_DIR)/remove-embedded-static-onnxruntime.stamp
        basedOnDependencyAnalysis: false
  SpokenMarginsLegacyShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsShareExtension/Sources
      - path: App/SpokenMarginsShareExtension/Resources
      - path: App/Gate2Shared/Sources
        excludes:
          - Gate2CompactCommandQueue.swift
          - Gate2CompactCommandURL.swift
          - Gate2LiveActivityAttributes.swift
      - path: App/SharedSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.legacy.share
        PRODUCT_NAME: SpokenMarginsLegacyShareExtension
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsLegacyShareExtension/SpokenMarginsLegacyShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "12"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_FILE: App/SpokenMarginsLegacyShareExtension/Info.plist
        MARKETING_VERSION: "0.1"
        SDKROOT: iphoneos
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPOKEN_MARGINS_LEGACY"
        IPHONEOS_DEPLOYMENT_TARGET: "16.7"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          "IPHONEOS_DEPLOYMENT_TARGET[sdk=iphonesimulator*]": "16.4"
  SpokenMarginsLegacyBrowserTextExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsBrowserTextExtension/Sources
      - path: App/SpokenMarginsBrowserTextExtension/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.legacy.browsertext
        PRODUCT_NAME: SpokenMarginsLegacyBrowserTextExtension
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsLegacyBrowserTextExtension/SpokenMarginsLegacyBrowserTextExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "12"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_FILE: App/SpokenMarginsLegacyBrowserTextExtension/Info.plist
        MARKETING_VERSION: "0.1"
        SDKROOT: iphoneos
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPOKEN_MARGINS_LEGACY"
        IPHONEOS_DEPLOYMENT_TARGET: "16.7"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          "IPHONEOS_DEPLOYMENT_TARGET[sdk=iphonesimulator*]": "16.4"
    postBuildScripts:
      - name: Select Legacy Native Messaging Host
        script: |
          popup_path="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/popup.js"
          /usr/bin/sed -i '' 's/com.spokenmargins.native.browsertext/com.spokenmargins.native.legacy.browsertext/g' "$popup_path"
        basedOnDependencyAnalysis: false
  SpokenMarginsAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/SpokenMarginsAppUITests
      - path: App/TestFixtures
        buildPhase: resources
    dependencies:
      - target: SpokenMarginsApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.uitests
        TEST_TARGET_NAME: SpokenMarginsApp
  SpokenMarginsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/SpokenMarginsAppTests
        excludes:
          - Gate4WatchPackageRenderTests.swift
      - path: App/TestFixtures
        buildPhase: resources
    dependencies:
      - target: SpokenMarginsApp
      - package: SessionKit
        product: SessionKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: J8SWC6J3VY
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpokenMarginsApp.app/SpokenMarginsApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SpokenMarginsApp:
    build:
      targets:
        SpokenMarginsApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpokenMarginsAppTests
        - SpokenMarginsAppUITests
  SpokenMarginsLegacy:
    build:
      targets:
        SpokenMarginsLegacy: all
    run:
      config: Debug
