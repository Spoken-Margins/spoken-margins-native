name: SpokenMarginsNative
options:
  bundleIdPrefix: com.spokenmargins
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
packages:
  SessionKit:
    path: Packages/SessionKit
targets:
  SpokenMarginsApp:
    type: application
    platform: iOS
    sources:
      - path: App/SpokenMarginsApp/Sources
      - path: App/Gate2Shared/Sources
      - path: Contracts/fixtures
        type: folder
      - path: Contracts/traces
        type: folder
    dependencies:
      - target: SpokenMarginsWatch
        embed: true
      - target: SpokenMarginsBrowserTextExtension
      - target: SpokenMarginsGate2Widget
      - package: SessionKit
        product: SessionKit
      - package: SessionKit
        product: SessionKitPersistence
      - package: SessionKit
        product: SessionKitAudio
      - package: SessionKit
        product: SessionKitAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsApp/SpokenMarginsApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J8SWC6J3VY
        INFOPLIST_FILE: App/SpokenMarginsApp/Info.plist
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/SpokenMarginsApp/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: SpokenMarginsCompactControls
            CFBundleURLSchemes:
              - spokenmargins
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Spoken Margins records spoken interjections during listening sessions.
        NSSpeechRecognitionUsageDescription: Spoken Margins may transcribe spoken interjections when enabled.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  SpokenMarginsAppDevice:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
    sources:
      - path: App/SpokenMarginsApp/Sources
      - path: App/Gate2Shared/Sources
      - path: Contracts/fixtures
        type: folder
      - path: Contracts/traces
        type: folder
    dependencies:
      - target: SpokenMarginsWatch
        embed: true
      - target: SpokenMarginsBrowserTextExtension
      - target: SpokenMarginsGate2Widget
      - package: SessionKit
        product: SessionKit
      - package: SessionKit
        product: SessionKitPersistence
      - package: SessionKit
        product: SessionKitAudio
      - package: SessionKit
        product: SessionKitAI
      - package: SessionKit
        product: SessionKitKokoro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsApp/SpokenMarginsApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J8SWC6J3VY
        INFOPLIST_FILE: App/SpokenMarginsApp/Info.plist
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_SWIFT_FLAGS: "$(inherited) -D KOKORO_DEVICE"
    info:
      path: App/SpokenMarginsApp/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: SpokenMarginsCompactControls
            CFBundleURLSchemes:
              - spokenmargins
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Spoken Margins records spoken interjections during listening sessions.
        NSSpeechRecognitionUsageDescription: Spoken Margins may transcribe spoken interjections when enabled.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  SpokenMarginsGate2Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsGate2Widget/Sources
      - path: App/Gate2Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.gate2widget
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsGate2Widget/SpokenMarginsGate2Widget.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
    info:
      path: App/SpokenMarginsGate2Widget/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins Controls
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SpokenMarginsBrowserTextExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsBrowserTextExtension/Sources
      - path: App/SpokenMarginsBrowserTextExtension/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.browsertext
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsBrowserTextExtension/SpokenMarginsBrowserTextExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        INFOPLIST_FILE: App/SpokenMarginsBrowserTextExtension/Info.plist
        MARKETING_VERSION: "0.1"
        SDKROOT: iphoneos
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  SpokenMarginsWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/SpokenMarginsWatch/Sources
    dependencies:
      - package: SessionKit
        product: SessionKit
      - package: SessionKit
        product: SessionKitAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.watch
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: J8SWC6J3VY
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
    info:
      path: App/SpokenMarginsWatch/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.spokenmargins.native
        WKBackgroundModes:
          - audio
  SpokenMarginsAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/SpokenMarginsAppUITests
    dependencies:
      - target: SpokenMarginsApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.uitests
        TEST_TARGET_NAME: SpokenMarginsApp
  SpokenMarginsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/SpokenMarginsAppTests
    dependencies:
      - target: SpokenMarginsApp
      - package: SessionKit
        product: SessionKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpokenMarginsApp.app/SpokenMarginsApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SpokenMarginsApp:
    build:
      targets:
        SpokenMarginsApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpokenMarginsAppTests
        - SpokenMarginsAppUITests
  SpokenMarginsAppDevice:
    build:
      targets:
        SpokenMarginsAppDevice: all
    run:
      config: Debug
  SpokenMarginsWatch:
    build:
      targets:
        SpokenMarginsWatch: all
    run:
      config: Debug
