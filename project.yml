name: SpokenMarginsNative
options:
  bundleIdPrefix: com.spokenmargins
  deploymentTarget:
    iOS: "26.0"
# The signing team comes from the untracked Config/Local.xcconfig, through this file (#1841).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  SessionKit:
    path: Packages/SessionKit
targets:
  SpokenMarginsApp:
    type: application
    platform: iOS
    sources:
      - path: App/SpokenMarginsApp/Sources
        type: syncedFolder
        excludes:
          - SpokenMarginsApp/Gate3WatchConnectivityController.swift
          - SpokenMarginsApp/WatchPackageRenderCoordinator.swift
      - path: App/Gate2Shared/Sources
        type: syncedFolder
      - path: App/SharedSources
        type: syncedFolder
      # Supertonic's licences and modification notice only; the model is a download from Settings › Voices (#1820).
      - path: App/SpokenMarginsApp/Resources/Supertonic
        type: folder
        buildPhase: resources
      - path: App/SpokenMarginsApp/Resources/Kitten
        type: folder
        buildPhase: resources
      - path: App/SpokenMarginsApp/Resources/Legal
        type: folder
        buildPhase: resources
      - path: App/SpokenMarginsApp/Resources/VoiceCatalog
        type: folder
        buildPhase: resources
      - path: Contracts/voice-models/licenses
        type: folder
        buildPhase: resources
      - path: App/SharedResources/browserTextCapture.js
        buildPhase: resources
      - path: App/SharedResources/Defuddle-LICENSE.txt
        buildPhase: resources
      - path: App/SharedResources/BundledJavaScript-NOTICES.txt
        buildPhase: resources
      - path: Site/onboarding/catalog/v1/catalog.json
        buildPhase: resources
      - path: Contracts/fixtures
        type: folder
      - path: Contracts/traces
        type: folder
    dependencies:
      - target: SpokenMarginsGate2Widget
      - target: SpokenMarginsShareExtension
      - target: SpokenMarginsBrowserTextExtension
      - package: SessionKit
        product: SessionKit
      - package: SessionKit
        product: SessionKitPersistence
      - package: SessionKit
        product: SessionKitAudio
      - package: SessionKit
        product: SessionKitSharing
      - package: SessionKit
        product: SessionKitAI
      - package: SessionKit
        product: SessionKitSupertonic
      - package: SessionKit
        product: SessionKitEPUB
      - package: SessionKit
        product: SessionKitFeeds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsApp/SpokenMarginsApp.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "35"
        INFOPLIST_FILE: App/SpokenMarginsApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Spoken Margins
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: "0.1"
        REMOVE_STATIC_EXECUTABLES_FROM_EMBEDDED_BUNDLES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    postBuildScripts:
      - name: Normalize and Re-sign Embedded Framework
        script: |
          "$SRCROOT/scripts/normalize-embedded-framework-minimum-os.sh" \
            "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/onnxruntime.framework" \
            "$IPHONEOS_DEPLOYMENT_TARGET"
        basedOnDependencyAnalysis: false
    info:
      path: App/SpokenMarginsApp/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SMBuildCommit: $(SM_BUILD_COMMIT)
        CFBundleURLTypes:
          - CFBundleURLName: SpokenMarginsCompactControls
            CFBundleURLSchemes:
              - spokenmargins
        CFBundleDocumentTypes:
          - CFBundleTypeName: Spoken Margins Package
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.spokenmargins.package
          - CFBundleTypeName: Listening Edition JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.spokenmargins.package
            UTTypeDescription: Spoken Margins Package
            UTTypeConformsTo:
              - public.content
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - spokenmargins
              public.mime-type:
                - application/vnd.spokenmargins.package+zip
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        SMRemoteProviderExperienceEnabled: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Spoken Margins records your spoken Margins while you listen. Recordings stay on your phone.
        NSSpeechRecognitionUsageDescription: Spoken Margins turns your spoken Margins into text so you can search and copy them.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.spokenmargins.native.audio-preparation
          - com.spokenmargins.native.audio-preparation.continued
          - com.spokenmargins.native.feed-refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  SpokenMarginsGate2Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsGate2Widget/Sources
        type: syncedFolder
      - path: App/Gate2Shared/Sources
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.gate2widget
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsGate2Widget/SpokenMarginsGate2Widget.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "35"
        ENABLE_DEBUG_DYLIB: NO
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
    info:
      path: App/SpokenMarginsGate2Widget/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins Controls
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SpokenMarginsBrowserTextExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsBrowserTextExtension/Sources
        type: syncedFolder
      - path: App/SpokenMarginsBrowserTextExtension/Resources
      - path: App/SharedResources/browserTextCapture.js
        buildPhase: resources
      - path: App/SharedResources/Defuddle-LICENSE.txt
        buildPhase: resources
      - path: App/SharedResources/BundledJavaScript-NOTICES.txt
        buildPhase: resources
      - path: App/Gate2Shared/Sources/SourceLinkHandoff.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.browsertext
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsBrowserTextExtension/SpokenMarginsBrowserTextExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "35"
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_FILE: App/SpokenMarginsBrowserTextExtension/Info.plist
        MARKETING_VERSION: "0.1"
        SDKROOT: iphoneos
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  SpokenMarginsShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/SpokenMarginsShareExtension/Sources
        type: syncedFolder
      - path: App/SpokenMarginsShareExtension/Resources
      # Shared text routing (#662), host-tested in SessionKit. The extension compiles these two
      # Foundation-only files rather than linking SessionKit.
      - path: Packages/SessionKit/Sources/SessionKit/ClipboardIntakeClassifier.swift
      - path: Packages/SessionKit/Sources/SessionKit/SharedTextIntake.swift
      - path: App/Gate2Shared/Sources
        type: syncedFolder
        excludes:
          - Gate2CompactCommandQueue.swift
          - Gate2CompactCommandURL.swift
          - Gate2LiveActivityAttributes.swift
          - Gate2LiveActivityIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.share
        CODE_SIGN_ENTITLEMENTS: App/SpokenMarginsShareExtension/SpokenMarginsShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "35"
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_FILE: App/SpokenMarginsShareExtension/Info.plist
        MARKETING_VERSION: "0.1"
        SDKROOT: iphoneos
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/SpokenMarginsShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Spoken Margins
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SourceLinkShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: SourceLinkPreprocessor
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem,
              SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.spokenmargins.package" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text" ||
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.property-list"
              ).@count > 0
              ).@count > 0
  SpokenMarginsAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/SpokenMarginsAppUITests
        type: syncedFolder
      - path: App/TestFixtures
        buildPhase: resources
    dependencies:
      - target: SpokenMarginsApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.uitests
        TEST_TARGET_NAME: SpokenMarginsApp
  SpokenMarginsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/SpokenMarginsAppTests
        type: syncedFolder
        excludes:
          - Gate4WatchPackageRenderTests.swift
      - path: App/TestFixtures
        buildPhase: resources
    dependencies:
      - target: SpokenMarginsApp
      - package: SessionKit
        product: SessionKit
      - package: SessionKit
        product: SessionKitAudio
      - package: SessionKit
        product: SessionKitEPUB
      - package: SessionKit
        product: SessionKitFeeds
      # Build 29's frozen packet reader, so a test can read the packet the app's exporter wrote (#1039).
      - package: SessionKit
        product: ShippedPacketReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spokenmargins.native.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpokenMarginsApp.app/SpokenMarginsApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SpokenMarginsApp:
    build:
      targets:
        SpokenMarginsApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpokenMarginsAppTests
        - SpokenMarginsAppUITests

  SpokenMarginsAppBehavior:
    build:
      targets:
        SpokenMarginsApp: [test]
    test:
      config: Debug
      testPlans:
        - path: TestPlans/AppBehavior.xctestplan
          defaultPlan: true
        - path: TestPlans/AudioAdapters.xctestplan
  SpokenMarginsUISeams:
    build:
      targets:
        SpokenMarginsApp: [test]
    test:
      config: Debug
      testPlans:
        - path: TestPlans/UISeams.xctestplan
          defaultPlan: true
        - path: TestPlans/Smoke.xctestplan
        - path: TestPlans/SpeechCanary.xctestplan
  SpokenMarginsReleaseTests:
    build:
      targets:
        SpokenMarginsApp: [test]
    test:
      config: Debug
      testPlans:
        - path: TestPlans/Release.xctestplan
          defaultPlan: true
