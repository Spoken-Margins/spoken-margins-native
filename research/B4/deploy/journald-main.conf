# /etc/systemd/journald.conf.d/50-spokenmargins.conf, installed by deploy.sh.
# Retention for the MAIN journal (#2034). smserver has its own namespace
# (journald@smserver.conf); everything else on the box (Caddy, sshd, kernel
# firewall lines) lands here with distro defaults, which keep entries until
# the disk-percentage limits bite, often for months. An address can reach this
# journal from sshd, a firewall LOG rule, or a Caddy message the global filter
# in caddy-global.caddy doesn't cover, so this caps how long any of them stays.
# journald deletes only closed files, so MaxFileSec closes one a day;
# otherwise the 14-day limit wouldn't bite until the default monthly rotation.
# Storage= and the size limits are left alone on purpose.
[Journal]
MaxFileSec=1day
MaxRetentionSec=14day
