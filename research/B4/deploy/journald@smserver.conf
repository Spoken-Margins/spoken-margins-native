# NOT DEPLOYED. /etc/systemd/journald@smserver.conf
# Retention for smserver's hourly request summary only. journald deletes
# only closed journal files, so MaxFileSec closes one a day; otherwise the
# 14-day limit wouldn't bite until the default monthly rotation.
[Journal]
Storage=persistent
MaxFileSec=1day
MaxRetentionSec=14day
SystemMaxUse=200M
ForwardToSyslog=no
ForwardToWall=no
