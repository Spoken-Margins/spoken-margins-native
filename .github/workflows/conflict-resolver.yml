# Merge `main` into handed-off conflicting PRs when the conflict is small: the conflict resolver, live (#5320; owner's
# calls 2026-11-24 and 2026-11-26, docs/decisions.md).
#
# lane-conflicts.yml takes a conflicting armed PR out of the queue, labels it `conflict-resolver` and hands it off. The
# owning thread usually fixes it within minutes; one whose thread has ended waited a median of 2.3 h for the Mac
# finisher. This job resolves it instead, through scripts/conflict_resolver.py, which says what it does and does not
# do: it pushes the merge to the PR's branch as the App (never forced), adds `automerge` back so the PR merges only if
# its checks pass, and hands anything it can't merge to the Mac finisher (`needs-mac`). One record per PR head goes
# on #5320. lane_conflicts.py hands a `conflict-resolver` PR left for 2 hours to the finisher, so a failing run here
# never strands one.
#
# Safety (the owner's conditions):
# - The script and this file come from main: workflow_run, schedule and workflow_dispatch run the default branch's
#   copy. PR heads are fetched as git data and merged with no hooks, filters or user config; no PR code runs here.
# - Same-repo PRs by collaborators only, and only a PR whose head has carried the hand-off for 30 minutes with no
#   push, or that a collaborator handed off: one writer per branch. The push is a fast-forward or nothing, so a
#   branch its thread pushed meanwhile stays the thread's.
# - Claude gets the conflict text and nothing else: no tools (`--tools ""`), run from an empty folder, with every
#   GitHub token removed from its environment. Its reply may only fill in the hunks it was given.
# - The Claude token is the claude-audit environment's (only main may use it), the same one the audit uses; no new
#   secret. Reads use the App's read-only token; the push, the labels and the PR comments use a second App token
#   (contents and workflows write, so a merge that brings main's workflow changes can be pushed, and so the push
#   starts the PR's checks, as a GITHUB_TOKEN push would not); the records on #5320 use GITHUB_TOKEN.
# - Any PR touching .github/, scripts/lane-runner.py, SessionKitPersistence or SessionKitSharing goes to the finisher.
#
# Cost and catch: a run with nothing eligible is under a minute of Linux and no tokens. An eligible small or medium
# conflict is about 5 to 15 minutes of Linux and one Sonnet call (the retrospective's 116 hand-offs cost $0.90 in all),
# and its push runs the PR's own checks once, as a thread's fix would. Capped at 3 PRs a run and 25 a day, one run at a
# time. It catches the finisher's tail: in the retrospective (#5320, 2026-11-26) it would have merged 32 of 116
# hand-offs, 26 of 31 gradable ones the same as or equivalent to the thread's own merge; 5 were wrong, 2 of them in
# docs where checks would not notice. Waste signal: a resolver merge that a thread or the owner has to fix or revert
# more than about one time in five (count them from the #5320 records against later commits), or its PRs failing
# checks more often than the threads' own merges did.
name: conflict-resolver

on:
  # The usual start: a sweep that may have handed off a conflict. The 30-minute wait means the hand-off itself is
  # usually not yet eligible, so the 15-minute schedule picks it up later.
  workflow_run:
    workflows: [lane-conflicts]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Only this PR (it must still carry conflict-resolver and be eligible)'
        required: false
        type: string

permissions:
  contents: read  # the push to the PR branch is the App's, below
  issues: write  # the records on #5320
  pull-requests: read

jobs:
  resolve:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped'
    concurrency:
      group: conflict-resolver
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: claude-audit
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ vars.SM_TRUNK || 'main' }}
          persist-credentials: false
          sparse-checkout: |
            scripts/conflict_resolver.py
            scripts/lane_conflicts.py
            scripts/comment_trust.py
          sparse-checkout-cone-mode: false
      - name: Install Claude Code
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.295
          echo "SM_CLAUDE_CLI=$(npm prefix --global)/bin/claude" >> "$GITHUB_ENV"
      - id: app-token
        # A failed mint falls back to GITHUB_TOKEN instead of failing the run.
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.SM_APP_ID }}
          private-key: ${{ secrets.SM_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
          permission-actions: read
      - id: app-write-token
        # A failed mint leaves SM_APP_TOKEN empty: the script then does nothing, and lane_conflicts.py hands waiting
        # PRs to the Mac finisher after 2 hours.
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.SM_APP_ID }}
          private-key: ${{ secrets.SM_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write
      - name: Merge small conflicts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          SM_WRITE_TOKEN: ${{ github.token }}
          SM_APP_TOKEN: ${{ steps.app-write-token.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ONLY_PR: ${{ inputs.pr }}
        run: python3 scripts/conflict_resolver.py run ${ONLY_PR:+--pr "$ONLY_PR"}
