# The Claude audit of risky and lane PRs, off the owner's laptop (#2170; owner's call in docs/decisions.md).
#
# It ran as a launchd job on his Mac (ops/codex/sm_codex_audit.py), so on 2026-11-05 PRs that needed it waited for his
# Mac to wake. It is the same script here. It runs Claude Code on his subscription, through the token `claude setup-token`
# makes, not on API billing. Without the secret it logs "paused" and posts nothing.
#
# Safety:
# - The script comes from the trunk, never from a PR. schedule, workflow_run and workflow_dispatch all run the default
#   branch's copy of this file. A fork's PR never reaches it with its own code.
# - It runs no PR code. The audit reads the diff and the PR's files as text, in a worktree of the trunk, with the
#   tools Read, Grep and Glob, in a mode that refuses any path outside that worktree. So it can't read this job's
#   environment.
# - The token is a secret of the `claude-audit` environment, which only `main` may use. A repository secret would reach
#   a workflow on any branch, so anyone with write access could read it.
# - The script skips PRs from forks, keeps the GitHub token out of Claude's environment, and won't post a comment that
#   contains the Claude token.
#
# A label change made with this job's token starts no workflow run, so the re-arm after a clean audit also dispatches
# lane.yml, and the tap check dispatches owner-tap-alert.yml.
name: claude-audit

on:
  schedule:
    - cron: '3,18,33,48 * * * *'  # the backstop; GitHub may run these late
  workflow_run:  # the usual start: a lane report is what makes a PR ready for its audit
    workflows: [lane]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Audit only this PR, again if its head was already audited'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write  # the audit comment and the re-arm's labels
  issues: write
  actions: write  # dispatching lane.yml and owner-tap-alert.yml, and reading whether an automerge job holds a slot
  checks: read
  statuses: read

# One run at a time, with one waiting: GitHub replaces an older waiting run, and the newest reads every PR anyway.
concurrency:
  group: claude-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: claude-audit
    # CLAUDE_TIMEOUT_S is 30 minutes per batch, and a run can hold several batches.
    timeout-minutes: 120
    env:
      SM_OPS_HOME: ${{ github.workspace }}/.sm-ops
      SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The script's memory between runs: heads whose audit failed (no blind retries) and its token ledger.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .sm-ops/codex-audit/codex-audit-failures.json
            .sm-ops/ledger/usage.jsonl
          key: claude-audit-state-${{ github.run_id }}
          restore-keys: claude-audit-state-
      - name: Install Claude Code
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.295
          echo "SM_CLAUDE_CLI=$(npm prefix --global)/bin/claude" >> "$GITHUB_ENV"
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ONLY_PR: ${{ inputs.pr }}
        run: python3 ops/codex/sm_codex_audit.py ${ONLY_PR:+--pr "$ONLY_PR"}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && hashFiles('.sm-ops/codex-audit/codex-audit-failures.json', '.sm-ops/ledger/usage.jsonl') != ''
        with:
          path: |
            .sm-ops/codex-audit/codex-audit-failures.json
            .sm-ops/ledger/usage.jsonl
          key: claude-audit-state-${{ hashFiles('.sm-ops/codex-audit/codex-audit-failures.json', '.sm-ops/ledger/usage.jsonl') }}
