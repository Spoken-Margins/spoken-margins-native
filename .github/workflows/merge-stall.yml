# Tell the owner when merging has stopped, from a machine that isn't his laptop (#3502).
#
# On 2026-11-05 nothing merged for 11.5 hours while his Mac slept, and the only thing that would have said so ran on that
# Mac. scripts/merge_stall_watch.py decides: nothing on the trunk for an hour, and an armed PR that hasn't moved for an
# hour. It then opens one issue that @mentions him, which the GitHub mobile app pushes, and closes it when something
# merges. It runs nobody's PR code: the script comes from the trunk, and it reads PRs only through the API.
#
# Start (#4866): a stall is the absence of progress, so no event can announce it; what an event can do is look each time
# a PR's hosted checks finish (`workflow_run`), which is when progress is made or isn't. The 15-minute cron GitHub dropped
# (3 runs of 96 in the 24 hours to 2026-11-21) is replaced by the VPS (ops/dispatch-backstop/), which fires
# `workflow_dispatch` when no run began in the last 15 minutes. The one daily tick is the last resort if the VPS is down.
name: merge-stall

on:
  workflow_run:
    workflows: [hosted-portable, hosted-web, hosted-sessionkit-linux]
    types: [completed]
  schedule:
    - cron: '7 6 * * *'  # last resort only
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  checks: read
  actions: read  # the budget warning lists the last hour's runs (#4990)

concurrency:
  group: merge-stall
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/merge_stall_watch.py
            scripts/api_budget_watch.py
            scripts/comment_trust.py
            scripts/trunk.py
          sparse-checkout-cone-mode: false
      # #4990: warn the owner at 70% of the workflow token's hourly API budget, before checks fail on it. A step here,
      # not a workflow of its own: this job already runs when PRs' checks finish and from the VPS every 15 minutes, so it
      # adds no run. Cost and catch: one uncounted `rate_limit` read a run below 70%; at most 4 calls on the one run
      # an hour window that warns, 2 on later runs in that window. It would have caught the holds of #4985 and #4983
      # on 2026-11-22. Waste signal: no warning in 30 days and no rate-limit line in any `merge policy` log.
      - name: Read the API budget
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/api_budget_watch.py  # exits 0 whatever GitHub answers, so the stall look always runs
      - name: Look for a stall
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
        run: python3 scripts/merge_stall_watch.py
