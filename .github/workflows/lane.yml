# The lane's deterministic tiers (T2, T3) on the Mac's self-hosted runner. See
# docs/workstreams/test-lane.md for the request and report formats, and scripts/lane-runner.py.
#
# A stream asks by commenting `/lane T2` or `/lane T3` on its PR into next and adding the
# lane:queued label. The automerge label asks for the checks a finished PR needs without a comment:
# --plan fast for Mac diffs; T0 and ops plus docs run on a GitHub-hosted Linux runner (#861, #2442), with no app build, again on
# every push while the label stays. On PASS the runner merges the PR itself (decision 3, approved by
# the owner): it tests the exact merge commit, next first, and pushes it to next, unless the PR
# is an audio, persistence, packet or lane change with no clean Codex audit of its head yet
# (scripts/lane-runner.py). Other lane changes merge that way too (owner rule 2026-10-01), but the
# runner never merges a change to this file, anything else under .github/ or scripts/lane-runner.py:
# those need the owner's tap (owner rule 2026-10-09, #1203).
#
# Trigger: pull_request. GitHub builds these runs from the PR's merge ref, which it doesn't refresh
# when next moves, so a PR last pushed before this file reached next gets no run (#221) until it
# merges next and pushes; a PR that conflicts with next gets no run either. The other triggers
# don't help: comment events and pull_request_target always use the default branch's (main's)
# copy of this file, and main's copy is the old one from the last release, not next's.
# The job checks out the PR head, takes lane-runner.py from the base branch, and lets it merge the
# newest base in itself, so a report always tests the PR against the current next.
#
# `lane-check/**` bases exist only to test a change to the lane before it reaches next.
#
# Forks (#1719): every job that takes a pull_request event checks that the PR's head repository is this
# one. `release` takes only workflow_dispatch, which needs write access, and lane-runner.py re-checks the
# PR's head repository before it tests anything. pull_request_target is not used: it would run main's copy
# of this file, which lags next's, with a write token next to PR code. A fork's PR can still edit
# this file in its own merge ref, so the runners' own job-started hook (ops/runner-guard) is what actually
# keeps fork code off the Mac and the VPS.
#
# workflow_dispatch (#1209): when a T3 PASS releases a held automerge run whose host tests have to run again, the
# lane job on the simulator runner dispatches this workflow on the base branch with the PR, its head and the T3
# report, and moves on to the next T3. The `release` job then runs those checks on a build runner and merges on
# PASS. Unlike a label change, a dispatch sent with the workflow's own token does start a run. The dispatched run
# uses the base branch's copy of this file and of lane-runner.py, never the PR's.
#
# Hosted T2 and T3 (#1389 phase 2): with the repository variable LANE_HOSTED_APP `on`, the route job sends the `lane`
# job to a GitHub-hosted Mac (xcode-27, Xcode 27.0, as hosted-portable.yml). The steps marked "hosted Mac only" set it
# up: the lane's state and evidence folders in the job's temporary folder (so its slots and simulator template are its
# own), the Python tools, Git LFS from a cache, and Xcode's compilation cache; afterwards the evidence is uploaded as the
# run's `lane-evidence` artifact. On the Mac those steps are skipped and the job runs exactly as before. Unset (the
# private repo, whose hosted minutes cost money), nothing changes. The `automerge` and `release` jobs stay on the Mac
# or a GitHub-hosted Linux runner. Set it once the repo is public: `gh variable set LANE_HOSTED_APP --body on`.
name: lane

# The run name carries what scripts/lane_dedupe.py needs to tell this PR's runs apart (#860): the PR, the
# head and which of the two Mac jobs the event asks for, with the same conditions as the jobs' `if`.
run-name: >-
  lane pr=${{ github.event.pull_request.number || inputs.pr }} head=${{ github.event.pull_request.head.sha || inputs.head }}
  lane=${{ contains(github.event.pull_request.labels.*.name, 'lane:queued') && (github.event.action != 'labeled' || github.event.label.name == 'lane:queued') }}
  auto=${{ contains(github.event.pull_request.labels.*.name, 'automerge') && (github.event.action != 'labeled' || github.event.label.name == 'automerge') }}

on:
  pull_request:
    # Both trunks (#1492); the jobs below run only for PRs into the trunk named by SM_TRUNK, or a lane-check base.
    branches: [next, main, 'lane-check/**']
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: 'The PR whose released automerge run to test and merge'
        required: true
        type: string
      head:
        description: 'The PR head (full SHA) the T3 passed on'
        required: true
        type: string
      t3:
        description: 'Link to the T3 PASS report that released it'
        required: false
        type: string

permissions:
  # write: the runner pushes the merge commits it tested to next. The checkout keeps no credentials
  # and the PR's own builds and tests run without the token, so only lane-runner.py (taken from the
  # base branch) can use it.
  contents: write
  pull-requests: write
  issues: write
  # read: the automerge runs read the hosted fast checks' results on the PR's head (#1389).
  checks: read
  # write: after pushing the trunk's new tip, the automerge and release runs start hosted-integration.yml on it
  # (lane-runner.py dispatch_hosted_integration); without it GitHub answers 403.
  actions: write

jobs:
  route:
    # Cheap hosted routing, before a job enters either Mac queue. Only same-repo requests.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref == (vars.SM_TRUNK || 'main') || startsWith(github.event.pull_request.base.ref, 'lane-check/')) &&
      ((contains(github.event.pull_request.labels.*.name, 'lane:queued') &&
        (github.event.action != 'labeled' || github.event.label.name == 'lane:queued')) ||
       (contains(github.event.pull_request.labels.*.name, 'automerge') &&
        (github.event.action != 'labeled' || github.event.label.name == 'automerge')))
    # GitHub-hosted (free for the public repo; on the owner's VPS until #2442), so it never queues behind a lane job.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      # write: cancelling this PR's older queued runs (scripts/lane_dedupe.py). Only base-branch code runs here.
      actions: write
    outputs:
      lane: ${{ steps.route.outputs.lane }}
      automerge: ${{ steps.route.outputs.automerge }}
      # A sender without write access (and not the bot) starts neither Mac queue (#1822).
      skip_lane: ${{ steps.sender.outputs.trusted == 'false' && 'true' || steps.dedupe.outputs.skip_lane }}
      skip_automerge: ${{ steps.sender.outputs.trusted == 'false' && 'true' || steps.dedupe.outputs.skip_automerge }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Policy and code from the base branch's tip, never PR code with the runner-discovery token. Not
          # pull_request.base.sha: a PR's recorded base only moves when the PR does, so a label event on an older PR
          # routed with stale rules (2026-10-22: #2454 kept the pre-#2458 Mac route after #2458 merged).
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          # No LFS downloads or history needed to classify infrastructure paths.
          sparse-checkout: |
            scripts/test-scope.py
            scripts/lane_dedupe.py
            scripts/lane_sender.py
            project.yml
          sparse-checkout-cone-mode: false
      - name: Discover runners and changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS_TOKEN: ${{ secrets.SM_LANE_RUNNERS_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Denied runner-list access, API outages, and uninstalled runners all fall back.
          GH_TOKEN="$RUNNERS_TOKEN" timeout 30s gh api --paginate --slurp "repos/$GH_REPO/actions/runners?per_page=100" > "$RUNNER_TEMP/runners.json" || echo '[]' > "$RUNNER_TEMP/runners.json"
          timeout 30s gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/files.json" || echo '[]' > "$RUNNER_TEMP/files.json"
      - name: Choose queues
        id: route
        env:
          # #1389 phase 2: `on` sends the lane job (T2/T3) to a GitHub-hosted Mac (test-scope.py hosted_app_routing).
          LANE_HOSTED_APP: ${{ vars.LANE_HOSTED_APP }}
          # #2459: with LANE_HOSTED_FAST `on`, every automerge job starts on hosted Linux (test-scope.py
          # hosted_merge_routing); with LANE_HOSTED_MAC_REST `on` too it merges there on the three hosted checks.
          LANE_HOSTED_FAST: ${{ vars.LANE_HOSTED_FAST }}
          LANE_HOSTED_MAC_REST: ${{ vars.LANE_HOSTED_MAC_REST }}
        run: |
          # The base can predate this helper while this workflow is first being introduced.
          if python3 scripts/test-scope.py --runner-routing "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/files.json" "$RUNNER_TEMP/runners.json" > "$RUNNER_TEMP/route.json"; then
            jq -r 'to_entries[] | "\(.key)=\(.value | tojson)"' "$RUNNER_TEMP/route.json" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Runner routing unavailable; using the normal Mac queues.'
          fi
      - name: Check who sent the event
        id: sender
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          # Whoever added the label or pushed must have write access, or be the project bot (#1822). Fails closed:
          # when GitHub can't say, no run starts, and a trusted person re-adding the label starts it.
          python3 scripts/lane_sender.py "$SENDER" >> "$GITHUB_OUTPUT"
      - name: Drop stale and duplicate runs
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WANT_LANE: ${{ contains(github.event.pull_request.labels.*.name, 'lane:queued') && (github.event.action != 'labeled' || github.event.label.name == 'lane:queued') }}
          WANT_AUTO: ${{ contains(github.event.pull_request.labels.*.name, 'automerge') && (github.event.action != 'labeled' || github.event.label.name == 'automerge') }}
        run: |
          # A same-head run still waiting in a different queue than the one chosen above is replaced (#1194).
          # Closed or moved-on PRs and duplicate runs stop here; older-head runs still waiting for a Mac are
          # cancelled. Any failure (including a base without the helper) leaves both outputs unset: run as before.
          # Bound all API calls together; discovery uses at most 60s, leaving 60s for checkout and routing.
          if timeout 60s python3 scripts/lane_dedupe.py --pr "$PR_NUMBER" --head "$EVENT_HEAD" --run-id "$RUN_ID" \
              --lane "$WANT_LANE" --auto "$WANT_AUTO" --queues "$RUNNER_TEMP/route.json" > "$RUNNER_TEMP/dedupe.json"; then
            jq -r 'to_entries[] | "\(.key)=\(.value | tojson)"' "$RUNNER_TEMP/dedupe.json" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Lane dedupe unavailable; running as before.'
          fi

  lane:
    # /lane T2 and T3 requests: main or priority runner, sharing the Mac-wide simulator slot.
    needs: route
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref == (vars.SM_TRUNK || 'main') || startsWith(github.event.pull_request.base.ref, 'lane-check/')) &&
      needs.route.outputs.skip_lane != 'true' &&
      contains(github.event.pull_request.labels.*.name, 'lane:queued') &&
      (github.event.action != 'labeled' || github.event.label.name == 'lane:queued')
    runs-on: ${{ fromJSON(needs.route.outputs.lane || '["self-hosted","macOS","sm-lane"]') }}
    # One runner is one lane, so runs from different PRs queue behind each other. Within a PR, a
    # newer queued run replaces one that hasn't started, so only the newest commit is tested. This
    # sits on the job, not the workflow, so skipped runs (other labels) never cancel a real one.
    concurrency:
      group: lane-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # 150 minutes for the T3 itself (slot wait, boot and tests), plus room for the automerge run a T3
    # PASS releases in this same job (#421): host tests, as in the automerge job, when the hand-off to the
    # build runner below fails.
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # write: hand a released automerge run's host tests to a build runner (workflow_dispatch, #1209).
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Event values reach the shell only through these variables, always quoted.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
      RUN_ID: ${{ github.run_id }}
      # #2459: a T3 PASS releases the held automerge run here, and when the three hosted checks stand for the head
      # it merges on them in seconds instead of handing host tests to the build Mac (merge_after_t3).
      LANE_HOSTED_FAST: ${{ vars.LANE_HOSTED_FAST }}
      LANE_HOSTED_MAC_REST: ${{ vars.LANE_HOSTED_MAC_REST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          # The Supertonic models are Git LFS files; without them the contracts check sees pointers.
          # The LFS cache lives in .git, which the checkout's clean keeps, so each runner downloads
          # the models once. A hosted Mac starts empty, so it fetches them from a cache below instead.
          lfs: ${{ runner.environment != 'github-hosted' }}
      - name: Take the lane runner from the base branch
        run: git show "origin/$BASE_REF:scripts/lane-runner.py" > "$RUNNER_TEMP/lane-runner.py"
      # ---- hosted Mac only (#1389 phase 2) ----
      - name: Hosted Mac - lane folders, Xcode and the iOS runtime
        if: runner.environment == 'github-hosted'
        run: |
          {
            echo "SM_LANE_GITHUB_HOSTED=1"
            echo "SM_LANE_STATE_DIR=$RUNNER_TEMP/lane-state"
            echo "SM_LANE_EVIDENCE_DIR=$RUNNER_TEMP/lane-evidence"
            echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/lane-state" "$RUNNER_TEMP/lane-evidence"
          # A fresh hosted Mac has no crash-report folder, and verify-tests.py stops with "Simulator crash reports are
          # unavailable" without one (#2557); the build Macs have it from their own use.
          mkdir -p "$HOME/Library/Logs/DiagnosticReports"
          export DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize
          # The lane tests on iOS 26 (lane_sim.IOS_MAJOR). If this image has no iOS 26 runtime, use its newest iOS;
          # the report's simulator line names the runtime either way.
          runtimes=$(xcrun simctl list runtimes --json)
          echo "$runtimes" | /usr/bin/python3 -c 'import json,sys; [print("runtime:", r["identifier"], r.get("isAvailable")) for r in json.load(sys.stdin)["runtimes"]]'
          major=$(echo "$runtimes" | /usr/bin/python3 -c 'import json,sys
          ok=[r["version"].split(".")[0] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r.get("platform")=="iOS"]
          print("26" if "26" in ok else (max(ok, key=int) if ok else "26"))')
          if [ "$major" != 26 ]; then
            echo "::warning title=Hosted lane iOS::No iOS 26 simulator runtime on this image; T3 runs on iOS $major."
          fi
          echo "SM_LANE_IOS_MAJOR=$major" >> "$GITHUB_ENV"
      - name: Hosted Mac - list LFS objects
        if: runner.environment == 'github-hosted'
        run: mkdir -p .build && git lfs ls-files --long | cut -d' ' -f1 | sort > .build/lfs-ids.txt
      - name: Hosted Mac - LFS cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.build/lfs-ids.txt') }}
          restore-keys: lfs-
      - name: Hosted Mac - fetch LFS files
        if: runner.environment == 'github-hosted'
        run: |
          # The checkout keeps no credentials; the job token is handed to this one command.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull
      # Rolling key: every run saves its cache and the next restores the newest. verify-tests.py keeps it in the lane
      # state folder, and Xcode bounds the store itself.
      - name: Hosted Mac - Xcode compilation cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/lane-state/compilation-cache
          key: xcode-cas-27.0-lane-${{ github.run_id }}
          restore-keys: xcode-cas-27.0-
      # The image's /usr/bin/python3 is 3.9, and requirements-dev.txt pins jsonschema 4.26.0, which needs 3.10 or newer:
      # every hosted T3 run died here with "No matching distribution" (#2545). The hosted workflows all use 3.12.
      - name: Hosted Mac - Python 3.12
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # verify-tests.py runs `xcodegen generate` before every T3 build, and the hosted image has no XcodeGen (the build
      # Macs have it from Homebrew): every hosted T3 died here with "No such file or directory: 'xcodegen'" (#2557).
      - name: Hosted Mac - XcodeGen
        if: runner.environment == 'github-hosted'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v xcodegen >/dev/null || brew install xcodegen; xcodegen --version
      - name: Hosted Mac - Python tools
        if: runner.environment == 'github-hosted'
        env:
          GH_TOKEN: ''  # the PR's own script and requirements: no token, as for the PR's builds and tests
        run: PYTHON=python3 bash scripts/bootstrap-python-tools.sh
      # ---- end of hosted Mac only ----
      # The hosted Mac runs the lane on the 3.12 from setup-python, not the image's system Python (3.9): a piece of
      # 3.10+ syntax in lane-runner.py (#2545) otherwise dies at import. The build Macs keep their system Python.
      - name: Run the request
        id: run
        env:
          LANE_PYTHON: ${{ runner.environment == 'github-hosted' && 'python3' || '/usr/bin/python3' }}
        run: >-
          "$LANE_PYTHON" "$RUNNER_TEMP/lane-runner.py" --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode explicit
      # The check is red on FAIL (#184): project threads wake when a check on their PR fails, and
      # a FAIL is the PR's code. INCONCLUSIVE (held for T3, no simulator, a flood, a conflict with next)
      # stays green with a warning on the build Macs: the report and the lane:done relabel take it to the dispatcher.
      # On a hosted Mac an explicit request that did not pass is red too (#2575): every hosted T3 ran nothing (no
      # XcodeGen, no boot) and the check showed green. The thread that wakes reads the report; a runner fault gets one rerun.
      # This step runs after the report is posted and the labels are set. A job that dies before it
      # reports still fails at its Run step, so a lost report never looks green.
      - name: Verdict
        if: steps.run.outputs.reported == 'true'
        env:
          VERDICT: ${{ steps.run.outputs.verdict }}
          HOSTED_MAC: ${{ runner.environment == 'github-hosted' }}
        run: |
          echo "Lane verdict: $VERDICT (the report is on the PR)"
          if [ "$VERDICT" = FAIL ]; then
            echo "::error title=Lane FAIL::The lane reported FAIL. The report on the PR says why."
            exit 1
          elif [ "$HOSTED_MAC" = true ] && [ "$VERDICT" != PASS ]; then
            echo "::error title=Hosted lane $VERDICT::The requested hosted check did not pass, so its tests were not all run. The report on the PR says why."
            exit 1
          elif [ "$VERDICT" != PASS ]; then
            echo "::warning title=Lane $VERDICT::The lane reported $VERDICT, not a pass. The report on the PR says why."
          fi
      - name: Tidy up after a cancelled or failed run
        if: (failure() || cancelled()) && steps.run.outputs.reported != 'true'
        env:
          LANE_PYTHON: ${{ runner.environment == 'github-hosted' && 'python3' || '/usr/bin/python3' }}
        run: >-
          "$LANE_PYTHON" "$RUNNER_TEMP/lane-runner.py" --cleanup --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode explicit
      # hosted Mac only: the machine is gone after the job, so the report's evidence goes with the run. Logs, manifests
      # and reports only; result bundles are large and the logs name each failure.
      - name: Hosted Mac - keep the evidence
        if: always() && runner.environment == 'github-hosted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lane-evidence
          path: |
            ${{ runner.temp }}/lane-evidence/**/*.log
            ${{ runner.temp }}/lane-evidence/**/*.json
            ${{ runner.temp }}/lane-evidence/**/*.md
          if-no-files-found: ignore
          retention-days: 7

  automerge:
    needs: route
    # T0 and ops plus docs run on a GitHub-hosted Linux runner (#861; the VPS runner sm-vps-t1 until #2442).
    # #2459: with LANE_HOSTED_FAST `on`, every other diff starts there too, and a PR held for T3 is reported held in
    # seconds, taking no Mac. Otherwise it waits there for the hosted checks (hosted-portable.yml) on the head; a failed
    # one is the PR's FAIL. With LANE_HOSTED_MAC_REST `on` too it merges on all three and runs no test. With it off
    # (until #2469), once the pair has finished it posts nothing and sets needs_mac, and automerge-mac below runs
    # --plan fast-mac-rest on the build Mac and merges, so the Mac never idles waiting for the pair. The same hand-off
    # happens when the checks can't be had. With LANE_HOSTED_FAST unset, those diffs stay on the Mac as before.
    # A routing failure leaves the normal Mac default below. Explicit lane requests always stay on Mac.
    # The build-only runner waits for room first (lane-runner.py, wait_for_room_to_test_on_host).
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref == (vars.SM_TRUNK || 'main') || startsWith(github.event.pull_request.base.ref, 'lane-check/')) &&
      needs.route.outputs.skip_automerge != 'true' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      (github.event.action != 'labeled' || github.event.label.name == 'automerge')
    runs-on: ${{ fromJSON(needs.route.outputs.automerge || '["self-hosted","macOS","sm-lane-build"]') }}
    # One runner is one lane, so runs from different PRs queue behind each other. Within a PR, a
    # newer queued run replaces one that hasn't started, so only the newest commit is tested. This
    # sits on the job, not the workflow, so skipped runs (other labels) never cancel a real one.
    concurrency:
      group: lane-auto-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 150
    outputs:
      needs_mac: ${{ steps.run.outputs.needs_mac }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Event values reach the shell only through these variables, always quoted.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
      RUN_ID: ${{ github.run_id }}
      HOSTED_ARGS: ${{ contains(fromJSON(needs.route.outputs.automerge || '[]'), 'ubuntu-latest') && '--hosted' || '' }}
      # #1389 rollout guard: `on` once the repo is public, and the runner takes the hosted fast checks' PASS
      # (hosted-portable.yml) and runs only --plan fast-mac-rest on the Mac. Unset, the whole --plan fast, as before.
      LANE_HOSTED_FAST: ${{ vars.LANE_HOSTED_FAST }}
      LANE_HOSTED_MAC_REST: ${{ vars.LANE_HOSTED_MAC_REST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          # Mac host tests need the LFS models; hosted T0/ops checks read none of them.
          lfs: ${{ !contains(fromJSON(needs.route.outputs.automerge || '[]'), 'ubuntu-latest') }}
      - name: Prepare hosted evidence
        if: env.HOSTED_ARGS == '--hosted'
        run: |
          echo "GIT_LFS_SKIP_SMUDGE=1" >> "$GITHUB_ENV"
          echo "SM_LANE_EVIDENCE_DIR=$RUNNER_TEMP/lane-evidence" >> "$GITHUB_ENV"
          # The machine is the job's alone and gone afterwards (#2442), so the lane state is too: the step ledger
          # (lane_ledger.py, #1200) on the Mac no longer sees these T0/ops runs.
          echo "SM_LANE_STATE_DIR=$RUNNER_TEMP/lane-state" >> "$GITHUB_ENV"
      - name: Take the lane runner from the base branch
        run: git show "origin/$BASE_REF:scripts/lane-runner.py" > "$RUNNER_TEMP/lane-runner.py"
      - name: Run the request
        id: run
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode auto $HOSTED_ARGS
      # The check is red only on FAIL (#184): project threads wake when a check on their PR fails, and
      # a FAIL is the PR's code. INCONCLUSIVE (held for T3, no simulator, a flood, a conflict with next)
      # stays green with a warning: the report and the lane:done relabel take it to the dispatcher.
      # This step runs after the report is posted and the labels are set. A job that dies before it
      # reports still fails at its Run step, so a lost report never looks green.
      - name: Verdict
        if: steps.run.outputs.reported == 'true'
        env:
          VERDICT: ${{ steps.run.outputs.verdict }}
        run: |
          echo "Lane verdict: $VERDICT (the report is on the PR)"
          if [ "$VERDICT" = FAIL ]; then
            echo "::error title=Lane FAIL::The lane reported FAIL. The report on the PR says why."
            exit 1
          elif [ "$VERDICT" != PASS ]; then
            echo "::warning title=Lane $VERDICT::The lane reported $VERDICT, not a pass. The report on the PR says why."
          fi
      - name: Tidy up after a cancelled or failed run
        if: (failure() || cancelled()) && steps.run.outputs.reported != 'true'
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --cleanup --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode auto $HOSTED_ARGS
      - name: Keep hosted evidence
        if: always() && env.HOSTED_ARGS == '--hosted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lane-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lane-evidence
          retention-days: 7

  automerge-mac:
    # #2459: the hosted automerge job above handed this run over and posted nothing: with LANE_HOSTED_MAC_REST off,
    # because the hosted pair passed on this head; or because the hosted checks could not be had (one missing,
    # cancelled or never recorded, or next kept moving under them). This runs the automerge run the old way, on the
    # build Mac with its room rules: the hosted pair if it stands, and --plan fast-mac-rest here.
    # It asks for sm-lane-build only, never the priority runner (#2147) or the simulator runner.
    needs: [route, automerge]
    if: >-
      !cancelled() && needs.automerge.outputs.needs_mac == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref == (vars.SM_TRUNK || 'main') || startsWith(github.event.pull_request.base.ref, 'lane-check/')) &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: [self-hosted, macOS, sm-lane-build]
    # The automerge job's group: it has finished by now, and a newer push's pending run replaces this one.
    concurrency:
      group: lane-auto-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Event values reach the shell only through these variables, always quoted.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
      RUN_ID: ${{ github.run_id }}
      LANE_HOSTED_FAST: ${{ vars.LANE_HOSTED_FAST }}
      LANE_HOSTED_MAC_REST: ${{ vars.LANE_HOSTED_MAC_REST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - name: Take the lane runner from the base branch
        run: git show "origin/$BASE_REF:scripts/lane-runner.py" > "$RUNNER_TEMP/lane-runner.py"
      - name: Run the request
        id: run
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode auto
      # As the automerge job's: red only on FAIL (#184).
      - name: Verdict
        if: steps.run.outputs.reported == 'true'
        env:
          VERDICT: ${{ steps.run.outputs.verdict }}
        run: |
          echo "Lane verdict: $VERDICT (the report is on the PR)"
          if [ "$VERDICT" = FAIL ]; then
            echo "::error title=Lane FAIL::The lane reported FAIL. The report on the PR says why."
            exit 1
          elif [ "$VERDICT" != PASS ]; then
            echo "::warning title=Lane $VERDICT::The lane reported $VERDICT, not a pass. The report on the PR says why."
          fi
      - name: Tidy up after a cancelled or failed run
        if: (failure() || cancelled()) && steps.run.outputs.reported != 'true'
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --cleanup --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode auto

  release:
    # #1209: the automerge run a T3 PASS released, handed over by the lane job (see the top of this file). It runs
    # on a build runner under the build runner's room rules, then tests the merge commit and merges on PASS, as
    # the lane job used to on the simulator runner. lane-runner.py re-reads the PR and does nothing unless it is
    # still open on this head, armed and held for T3 with its T3 passed, so a stale or stray dispatch is harmless.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref_name == (vars.SM_TRUNK || 'main') || startsWith(github.ref, 'refs/heads/lane-check/'))
    runs-on: [self-hosted, macOS, sm-lane-build]
    # Its own group: sharing the automerge job's would let this replace a pending automerge run, or wait behind it.
    concurrency:
      group: lane-release-pr-${{ inputs.pr }}
      cancel-in-progress: false
    # The build runner's room wait (up to 90 minutes), then host tests, as in the automerge job.
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Dispatch inputs reach the shell only through these variables, always quoted.
      PR_NUMBER: ${{ inputs.pr }}
      EVENT_HEAD: ${{ inputs.head }}
      T3_REPORT: ${{ inputs.t3 }}
      BASE_REF: ${{ github.ref_name }}
      SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
      RUN_ID: ${{ github.run_id }}
      LANE_HOSTED_FAST: ${{ vars.LANE_HOSTED_FAST }}
      LANE_HOSTED_MAC_REST: ${{ vars.LANE_HOSTED_MAC_REST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      # Written under another name first: a redirect creates the file even when git show fails, and an empty
      # lane-runner.py would let the tidy step "succeed" without posting anything (#1542).
      - name: Take the lane runner from the base branch
        run: >-
          git show "origin/$BASE_REF:scripts/lane-runner.py" > "$RUNNER_TEMP/lane-runner.py.part" &&
          mv "$RUNNER_TEMP/lane-runner.py.part" "$RUNNER_TEMP/lane-runner.py"
      - name: Run the released automerge run
        id: run
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode release --t3-report "$T3_REPORT"
      # A dispatched run's check sits on next's tip, not on the PR, so a red one would read as "next is broken"
      # and wake nobody: every verdict stays green here. The report and the lane:done relabel carry a FAIL.
      - name: Verdict
        if: steps.run.outputs.reported == 'true'
        env:
          VERDICT: ${{ steps.run.outputs.verdict }}
        run: |
          echo "Lane verdict: $VERDICT (the report is on the PR)"
          if [ "$VERDICT" != PASS ]; then
            echo "::warning title=Lane $VERDICT::The lane reported $VERDICT, not a pass. The report on the PR says why."
          fi
      - name: Tidy up after a cancelled or failed run
        id: tidy
        if: (failure() || cancelled()) && steps.run.outputs.reported != 'true'
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --cleanup --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode release
      # #1542: the lane job left lane:done to this run, so a run that stops before it can report must still say so.
      # When the checkout, its LFS fetch or the runner fetch failed, the tidy step above has no lane-runner.py to
      # run. This step needs nothing they bring: only gh, the job's token and the quoted variables above. It posts
      # the tidy step's "stopped before reporting" note (without a tested next, so it never counts toward an
      # auto-revert) and removes and re-adds lane:done, which the Hourly dispatch wakes on. Like the release itself,
      # it does nothing for a PR that moved on, closed, lost automerge or isn't from this repository.
      # A run that never starts (cancelled or timed out in the queue) runs no step: the hand-off note on the PR says
      # when the dispatcher treats it as lost.
      - name: Say so on the PR when the tidy step could not
        if: (failure() || cancelled()) && steps.run.outputs.reported != 'true' && steps.tidy.outcome != 'success'
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::warning::The dispatch named no PR number and full head; nothing to report on.'
            exit 0
          fi
          pull=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '[.state, .head.sha, (.head.repo.full_name // "-"),
            .base.ref, (any(.labels[]; .name == "automerge") | tostring)] | join(" ")')
          if [ "$pull" != "open $EVENT_HEAD $GH_REPO $BASE_REF true" ]; then
            echo "PR #$PR_NUMBER moved on, closed or lost automerge ($pull); nothing to report."
            exit 0
          fi
          body="Lane: the automerge run stopped before reporting ($RUN_URL). It was the build runner's release run for \`${EVENT_HEAD:0:7}\` after its T3 PASS (#1209), and it ended (a failed checkout, a cancel or a timeout) before it could post a report. The T3 PASS stands: remove and re-add automerge to run the host tests and merge.
          <!-- lane-note -->"
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          gh api -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/lane%3Adone" > /dev/null 2>&1 || true
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f 'labels[]=lane:done' > /dev/null

  # A lane job whose runner is lost runs no step, so neither its tidy-up nor its report can speak: the PR keeps
  # lane:queued with its /lane request unanswered, and a held automerge run waits on a report that never comes
  # (#2174: the Mac runner's worker did not start within the runner's 30-second hand-over, GitHub failed the job
  # ten minutes later with "lost communication", and #2049 was left with nothing). This job runs on a GitHub-hosted
  # Linux runner (never the Mac the lane job was lost on), only when the lane job failed. `lane-runner.py --lost`,
  # taken from the base branch, finds out whether the lane job reported or tidied up (then it does nothing) and
  # otherwise posts an INCONCLUSIVE report naming the run and takes lane:queued and lane:running off. Not a lane
  # result: a failure here must not change the run's outcome. A cancelled lane job (replaced by a newer run of the
  # same PR, or cancelled by hand) is not handled here.
  lane-lost:
    needs: [route, lane]
    if: >-
      always() && needs.lane.result == 'failure' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Report a lane job that ended without a report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Base-branch code only, written under another name first so a failed download leaves nothing to run.
          if ! gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/scripts/lane-runner.py?ref=$BASE_REF" \
              > "$RUNNER_TEMP/lane-runner.py.part"; then
            echo "::error::Could not download lane-runner.py from $BASE_REF; the lost lane job on this PR was not reported."
            exit 1
          fi
          mv "$RUNNER_TEMP/lane-runner.py.part" "$RUNNER_TEMP/lane-runner.py"
          if ! grep -q -e '--lost' "$RUNNER_TEMP/lane-runner.py"; then
            echo '::warning::The base branch'"'"'s lane-runner.py has no --lost yet; nothing reported.'
            exit 0
          fi
          python3 "$RUNNER_TEMP/lane-runner.py" --lost --tree "$RUNNER_TEMP" --pr "$PR_NUMBER" \
            --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF"

  # Tell the coordinator when a Mac lane runner is left idle (#1215). One job per Mac job, so the
  # notice comes when either frees its runner, not when both are done (a PR with both labels runs
  # both). Each runs on the owner's VPS runner (never a Mac runner, so it can't queue behind a lane
  # job), with sm_lane_open.py taken from the base branch's tip. They stay on the VPS when everything else left it
  # (#2442): the 10-minute limit is a state file shared by every PR's runs, which hosted runners can't share. The script reads the runner list and
  # the jobs still waiting for a lane runner; if a runner is idle with no job to take it, it sends
  # "Lane open-<time>: <free> free, <queued> queued" through the Dial relay, at most once per 10
  # minutes (one state file on that runner, so the two jobs share it). With the two secrets unset, or
  # on any doubt, it sends nothing and the step still passes. It is not a gate: the Mac jobs and their
  # Verdict steps don't depend on it.
  lane-open-lane:
    needs: [route, lane]
    # The same-repo check repeats route's, so this VPS job never depends on another job's `if` alone (#1719).
    if: >-
      !cancelled() && needs.lane.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, sm-vps]
    timeout-minutes: 3
    permissions:
      contents: read
      # read: the runs and jobs it counts (the runner list uses RUNNERS_TOKEN below).
      actions: read
    steps:
      - name: Tell the coordinator the lane is open
        # Not a lane result: a failure here must not make the run look red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Reading the runner list needs more than the workflow token (as in route).
          RUNNERS_TOKEN: ${{ secrets.SM_LANE_RUNNERS_TOKEN || github.token }}
          SM_LANE_OPEN_URL: ${{ secrets.SM_LANE_OPEN_URL }}
          SM_LANE_OPEN_TOKEN: ${{ secrets.SM_LANE_OPEN_TOKEN }}
        run: |
          # Base-branch code only. A base without the script (before this reached next) sends nothing.
          if timeout 30s gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$GH_REPO/contents/ops/lane/sm_lane_open.py?ref=$BASE_REF" > "$RUNNER_TEMP/sm_lane_open.py"; then
            timeout 90s python3 "$RUNNER_TEMP/sm_lane_open.py" || echo '::warning::Lane open ping stopped.'
          else
            echo '::warning::sm_lane_open.py is not on the base branch yet; nothing sent.'
          fi

  lane-open-automerge:
    needs: [route, automerge]
    if: >-
      !cancelled() && needs.automerge.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, sm-vps]
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Tell the coordinator the lane is open
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUNNERS_TOKEN: ${{ secrets.SM_LANE_RUNNERS_TOKEN || github.token }}
          SM_LANE_OPEN_URL: ${{ secrets.SM_LANE_OPEN_URL }}
          SM_LANE_OPEN_TOKEN: ${{ secrets.SM_LANE_OPEN_TOKEN }}
        run: |
          if timeout 30s gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$GH_REPO/contents/ops/lane/sm_lane_open.py?ref=$BASE_REF" > "$RUNNER_TEMP/sm_lane_open.py"; then
            timeout 90s python3 "$RUNNER_TEMP/sm_lane_open.py" || echo '::warning::Lane open ping stopped.'
          else
            echo '::warning::sm_lane_open.py is not on the base branch yet; nothing sent.'
          fi
