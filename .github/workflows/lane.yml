# The lane's deterministic tiers (T2, T3) on the Mac's self-hosted runner. See
# docs/workstreams/test-lane.md for the request and report formats, and scripts/lane-runner.py.
#
# A stream asks by commenting `/lane T2` or `/lane T3` on its PR into next and adding the
# lane:queued label. The automerge label asks for the checks a finished PR needs without a comment:
# --plan fast, plus both builds when the diff reaches the app (scripts/test-scope.py), again on
# every push while the label stays. On PASS the runner merges the PR itself (decision 3, approved by
# the owner): it tests the exact merge commit, next first, and pushes it to next, unless the PR
# is an audio, persistence, packet or lane change with no clean Codex audit of its head yet
# (scripts/lane-runner.py). Lane changes, this file included, merge that way too (owner rule
# 2026-10-01).
#
# Trigger: pull_request. GitHub builds these runs from the PR's merge ref, which it doesn't refresh
# when next moves, so a PR last pushed before this file reached next gets no run (#221) until it
# merges next and pushes; a PR that conflicts with next gets no run either. The other triggers
# don't help: comment events and pull_request_target always use the default branch's (main's)
# copy of this file, and main doesn't carry it.
# The job checks out the PR head, takes lane-runner.py from the base branch, and lets it merge the
# newest base in itself, so a report always tests the PR against the current next.
#
# `lane-check/**` bases exist only to test a change to the lane before it reaches next.
name: lane

# The run name carries what scripts/lane_dedupe.py needs to tell this PR's runs apart (#860): the PR, the
# head and which of the two Mac jobs the event asks for, with the same conditions as the jobs' `if`.
run-name: >-
  lane pr=${{ github.event.pull_request.number }} head=${{ github.event.pull_request.head.sha }}
  lane=${{ contains(github.event.pull_request.labels.*.name, 'lane:queued') && (github.event.action != 'labeled' || github.event.label.name == 'lane:queued') }}
  auto=${{ contains(github.event.pull_request.labels.*.name, 'automerge') && (github.event.action != 'labeled' || github.event.label.name == 'automerge') }}

on:
  pull_request:
    branches: [next, 'lane-check/**']
    types: [labeled, synchronize, reopened]

permissions:
  # write: the runner pushes the merge commits it tested to next. The checkout keeps no credentials
  # and the PR's own builds and tests run without the token, so only lane-runner.py (taken from the
  # base branch) can use it.
  contents: write
  pull-requests: write
  issues: write

jobs:
  route:
    # Cheap hosted routing, before a job enters either Mac queue. Only same-repo requests.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((contains(github.event.pull_request.labels.*.name, 'lane:queued') &&
        (github.event.action != 'labeled' || github.event.label.name == 'lane:queued')) ||
       (contains(github.event.pull_request.labels.*.name, 'automerge') &&
        (github.event.action != 'labeled' || github.event.label.name == 'automerge')))
    # The owner's VPS runner (sm-vps), not a GitHub-hosted one: the free Linux minutes ran out in October.
    runs-on: [self-hosted, Linux, sm-vps]
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      # write: cancelling this PR's older queued runs (scripts/lane_dedupe.py). Only base-branch code runs here.
      actions: write
    outputs:
      lane: ${{ steps.route.outputs.lane }}
      automerge: ${{ steps.route.outputs.automerge }}
      skip_lane: ${{ steps.dedupe.outputs.skip_lane }}
      skip_automerge: ${{ steps.dedupe.outputs.skip_automerge }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Policy and code from the base, never PR code with the runner-discovery token.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          # No LFS downloads or history needed to classify infrastructure paths.
          sparse-checkout: |
            scripts/test-scope.py
            scripts/lane_dedupe.py
            project.yml
          sparse-checkout-cone-mode: false
      - name: Discover runners and changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS_TOKEN: ${{ secrets.SM_LANE_RUNNERS_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Denied runner-list access, API outages, and uninstalled runners all fall back.
          GH_TOKEN="$RUNNERS_TOKEN" timeout 30s gh api --paginate --slurp "repos/$GH_REPO/actions/runners?per_page=100" > "$RUNNER_TEMP/runners.json" || echo '[]' > "$RUNNER_TEMP/runners.json"
          timeout 30s gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/files.json" || echo '[]' > "$RUNNER_TEMP/files.json"
      - name: Drop stale and duplicate runs
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WANT_LANE: ${{ contains(github.event.pull_request.labels.*.name, 'lane:queued') && (github.event.action != 'labeled' || github.event.label.name == 'lane:queued') }}
          WANT_AUTO: ${{ contains(github.event.pull_request.labels.*.name, 'automerge') && (github.event.action != 'labeled' || github.event.label.name == 'automerge') }}
        run: |
          # Closed or moved-on PRs and duplicate runs stop here; older-head runs still waiting for a Mac are
          # cancelled. Any failure (including a base without the helper) leaves both outputs unset: run as before.
          # Bound all API calls together; discovery uses at most 60s, leaving 60s for checkout and routing.
          if timeout 60s python3 scripts/lane_dedupe.py --pr "$PR_NUMBER" --head "$EVENT_HEAD" --run-id "$RUN_ID" \
              --lane "$WANT_LANE" --auto "$WANT_AUTO" > "$RUNNER_TEMP/dedupe.json"; then
            jq -r 'to_entries[] | "\(.key)=\(.value | tojson)"' "$RUNNER_TEMP/dedupe.json" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Lane dedupe unavailable; running as before.'
          fi
      - name: Choose queues
        id: route
        run: |
          # The base can predate this helper while this workflow is first being introduced.
          if python3 scripts/test-scope.py --runner-routing "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/files.json" "$RUNNER_TEMP/runners.json" > "$RUNNER_TEMP/route.json"; then
            jq -r 'to_entries[] | "\(.key)=\(.value | tojson)"' "$RUNNER_TEMP/route.json" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Runner routing unavailable; using the normal Mac queues.'
          fi

  lane:
    # /lane T2 and T3 requests: main or priority runner, sharing the Mac-wide simulator slot.
    needs: route
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.route.outputs.skip_lane != 'true' &&
      contains(github.event.pull_request.labels.*.name, 'lane:queued') &&
      (github.event.action != 'labeled' || github.event.label.name == 'lane:queued')
    runs-on: ${{ fromJSON(needs.route.outputs.lane || '["self-hosted","macOS","sm-lane"]') }}
    # One runner is one lane, so runs from different PRs queue behind each other. Within a PR, a
    # newer queued run replaces one that hasn't started, so only the newest commit is tested. This
    # sits on the job, not the workflow, so skipped runs (other labels) never cancel a real one.
    concurrency:
      group: lane-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # 150 minutes for the T3 itself (slot wait, boot and tests), plus room for the automerge run a T3
    # PASS releases in this same job (#421): host tests and both builds, as in the automerge job.
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Event values reach the shell only through these variables, always quoted.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          # The Supertonic models are Git LFS files; without them the contracts check sees pointers.
          # The LFS cache lives in .git, which the checkout's clean keeps, so each runner downloads
          # the models once.
          lfs: true
      - name: Take the lane runner from the base branch
        run: git show "origin/$BASE_REF:scripts/lane-runner.py" > "$RUNNER_TEMP/lane-runner.py"
      - name: Run the request
        id: run
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode explicit
      # The check is red only on FAIL (#184): project threads wake when a check on their PR fails, and
      # a FAIL is the PR's code. INCONCLUSIVE (held for T3, no simulator, a flood, a conflict with next)
      # stays green with a warning: the report and the lane:done relabel take it to the dispatcher.
      # This step runs after the report is posted and the labels are set. A job that dies before it
      # reports still fails at its Run step, so a lost report never looks green.
      - name: Verdict
        if: steps.run.outputs.reported == 'true'
        env:
          VERDICT: ${{ steps.run.outputs.verdict }}
        run: |
          echo "Lane verdict: $VERDICT (the report is on the PR)"
          if [ "$VERDICT" = FAIL ]; then
            echo "::error title=Lane FAIL::The lane reported FAIL. The report on the PR says why."
            exit 1
          elif [ "$VERDICT" != PASS ]; then
            echo "::warning title=Lane $VERDICT::The lane reported $VERDICT, not a pass. The report on the PR says why."
          fi
      - name: Tidy up after a cancelled or failed run
        if: (failure() || cancelled()) && steps.run.outputs.reported != 'true'
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --cleanup --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode explicit

  automerge:
    needs: route
    # The automerge label: host tests and builds on the build queue or priority runner.
    # The build-only runner waits for room first (lane-runner.py, wait_for_room_to_build).
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.route.outputs.skip_automerge != 'true' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      (github.event.action != 'labeled' || github.event.label.name == 'automerge')
    runs-on: ${{ fromJSON(needs.route.outputs.automerge || '["self-hosted","macOS","sm-lane-build"]') }}
    # One runner is one lane, so runs from different PRs queue behind each other. Within a PR, a
    # newer queued run replaces one that hasn't started, so only the newest commit is tested. This
    # sits on the job, not the workflow, so skipped runs (other labels) never cancel a real one.
    concurrency:
      group: lane-auto-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Event values reach the shell only through these variables, always quoted.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          # The Supertonic models are Git LFS files; without them the contracts check sees pointers.
          # The LFS cache lives in .git, which the checkout's clean keeps, so each runner downloads
          # the models once.
          lfs: true
      - name: Take the lane runner from the base branch
        run: git show "origin/$BASE_REF:scripts/lane-runner.py" > "$RUNNER_TEMP/lane-runner.py"
      - name: Run the request
        id: run
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode auto
      # The check is red only on FAIL (#184): project threads wake when a check on their PR fails, and
      # a FAIL is the PR's code. INCONCLUSIVE (held for T3, no simulator, a flood, a conflict with next)
      # stays green with a warning: the report and the lane:done relabel take it to the dispatcher.
      # This step runs after the report is posted and the labels are set. A job that dies before it
      # reports still fails at its Run step, so a lost report never looks green.
      - name: Verdict
        if: steps.run.outputs.reported == 'true'
        env:
          VERDICT: ${{ steps.run.outputs.verdict }}
        run: |
          echo "Lane verdict: $VERDICT (the report is on the PR)"
          if [ "$VERDICT" = FAIL ]; then
            echo "::error title=Lane FAIL::The lane reported FAIL. The report on the PR says why."
            exit 1
          elif [ "$VERDICT" != PASS ]; then
            echo "::warning title=Lane $VERDICT::The lane reported $VERDICT, not a pass. The report on the PR says why."
          fi
      - name: Tidy up after a cancelled or failed run
        if: (failure() || cancelled()) && steps.run.outputs.reported != 'true'
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --cleanup --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF" --mode auto

  # Tell the coordinator when a Mac lane runner is left idle (#1215). One job per Mac job, so the
  # notice comes when either frees its runner, not when both are done (a PR with both labels runs
  # both). Each runs on the owner's VPS runner (never a Mac runner, so it can't queue behind a lane
  # job), with sm_lane_open.py taken from the base branch's tip. The script reads the runner list and
  # the jobs still waiting for a lane runner; if a runner is idle with no job to take it, it sends
  # "Lane open-<time>: <free> free, <queued> queued" through the Dial relay, at most once per 10
  # minutes (one state file on that runner, so the two jobs share it). With the two secrets unset, or
  # on any doubt, it sends nothing and the step still passes. It is not a gate: the Mac jobs and their
  # Verdict steps don't depend on it.
  lane-open-lane:
    needs: [route, lane]
    if: "!cancelled() && needs.lane.result != 'skipped'"
    runs-on: [self-hosted, Linux, sm-vps]
    timeout-minutes: 3
    permissions:
      contents: read
      # read: the runs and jobs it counts (the runner list uses RUNNERS_TOKEN below).
      actions: read
    steps:
      - name: Tell the coordinator the lane is open
        # Not a lane result: a failure here must not make the run look red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Reading the runner list needs more than the workflow token (as in route).
          RUNNERS_TOKEN: ${{ secrets.SM_LANE_RUNNERS_TOKEN || github.token }}
          SM_LANE_OPEN_URL: ${{ secrets.SM_LANE_OPEN_URL }}
          SM_LANE_OPEN_TOKEN: ${{ secrets.SM_LANE_OPEN_TOKEN }}
        run: |
          # Base-branch code only. A base without the script (before this reached next) sends nothing.
          if timeout 30s gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$GH_REPO/contents/ops/lane/sm_lane_open.py?ref=$BASE_REF" > "$RUNNER_TEMP/sm_lane_open.py"; then
            timeout 90s python3 "$RUNNER_TEMP/sm_lane_open.py" || echo '::warning::Lane open ping stopped.'
          else
            echo '::warning::sm_lane_open.py is not on the base branch yet; nothing sent.'
          fi

  lane-open-automerge:
    needs: [route, automerge]
    if: "!cancelled() && needs.automerge.result != 'skipped'"
    runs-on: [self-hosted, Linux, sm-vps]
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Tell the coordinator the lane is open
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUNNERS_TOKEN: ${{ secrets.SM_LANE_RUNNERS_TOKEN || github.token }}
          SM_LANE_OPEN_URL: ${{ secrets.SM_LANE_OPEN_URL }}
          SM_LANE_OPEN_TOKEN: ${{ secrets.SM_LANE_OPEN_TOKEN }}
        run: |
          if timeout 30s gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$GH_REPO/contents/ops/lane/sm_lane_open.py?ref=$BASE_REF" > "$RUNNER_TEMP/sm_lane_open.py"; then
            timeout 90s python3 "$RUNNER_TEMP/sm_lane_open.py" || echo '::warning::Lane open ping stopped.'
          else
            echo '::warning::sm_lane_open.py is not on the base branch yet; nothing sent.'
          fi
