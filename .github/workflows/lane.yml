# The lane's deterministic tiers (T2, T3) on the Mac's self-hosted runner. See
# docs/workstreams/test-lane.md for the request and report formats, and scripts/lane-runner.py.
#
# A stream asks by commenting `/lane T2` or `/lane T3` on its PR into next and adding the
# lane:queued label.
#
# Trigger: pull_request_target, so GitHub runs this file as it is on the base branch. A plain
# pull_request run is built from the PR's merge ref, which GitHub doesn't refresh when next moves:
# PRs last pushed before this workflow existed never triggered it (#221), and PRs that conflict
# with next never run at all. Comment events can't be used either; they only run from main.
# The job then checks out the PR head, takes lane-runner.py from the base branch, and lets it merge
# the newest base in itself (a conflict gets an INCONCLUSIVE report naming the files).
#
# pull_request_target runs PR code with the base repository's token. That is safe here: the repo
# is private, the job only runs for branches in this repository, the token can only read contents
# and write PR comments and labels, and no secrets are used. PR code already runs on this Mac for
# any lane request.
#
# `lane-check/**` bases exist only to test a change to this workflow before it reaches next.
name: lane

on:
  pull_request_target:
    branches: [next, 'lane-check/**']
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lane:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'lane:queued') &&
      (github.event.action != 'labeled' || github.event.label.name == 'lane:queued')
    runs-on: [self-hosted, macOS, sm-lane]
    # One runner is one lane, so runs from different PRs queue behind each other. Within a PR, a
    # newer queued run replaces one that hasn't started, so only the newest commit is tested. This
    # sits on the job, not the workflow, so skipped runs (other labels) never cancel a real one.
    concurrency:
      group: lane-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Event values reach the shell only through these variables, always quoted.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Take the lane runner from the base branch
        run: git show "origin/$BASE_REF:scripts/lane-runner.py" > "$RUNNER_TEMP/lane-runner.py"
      - name: Run the request
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF"
      - name: Tidy up after a cancelled or failed run
        if: failure() || cancelled()
        run: >-
          /usr/bin/python3 "$RUNNER_TEMP/lane-runner.py" --cleanup --tree "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
          --event-head "$EVENT_HEAD" --run-id "$RUN_ID" --base "$BASE_REF"
