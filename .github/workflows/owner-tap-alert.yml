# Push the owner's phone when a PR into next waits only for his merge tap (#2047).
#
# The lane runner never merges a PR touching scripts/lane-runner.py or .github/ (owner rule 2026-10-09). Agents
# post as the owner, and GitHub doesn't notify anyone of their own activity, so nothing told him one was ready:
# on 2026-10-18 #1964, #1966, #2038 and #1885 sat waiting only for his tap. scripts/owner_tap_alert.py checks
# every open PR into next and, for one that touches those paths and is ready (not a draft, no conflict, head
# checks finished with none failed, no blocking Claude audit on the head), posts one
# comment as github-actions[bot] that @mentions the owner, once per head. The GitHub mobile app pushes mentions.
#
# When it runs: a PR's checks are still running when its push event fires, and check_suite and workflow_run
# triggers only fire from the default branch (main carries no workflows until #1492). So the PR check workflows
# start it as they finish: linux-t1.yml and shipped-build-compat.yml each end with an `owner-tap-alert-dispatch`
# job that dispatches this workflow for the PR when it touches those paths (the workflow token may start
# workflow_dispatch runs). The last check to finish is the one whose dispatch finds the PR ready. It is not a job
# that waits for the checks: each VPS runner is a single runner that also runs those checks (and the lane's
# routing), so a waiting job would hold them up. After #1492 this moves to `check_suite`/`workflow_run` here.
# Also: ready_for_review, labeled or reopened on such a PR (its checks may already be done), the audit script
# after it audits one, and, optionally, the Mac tick as a backstop (ops/lane/README.md). Run it by hand with
# `gh workflow run owner-tap-alert.yml --ref next -f pr=N` (main carries no workflows, so always `--ref next`).
#
# The script is taken from next's tip (or the PR's base) with no credentials kept, and reads PRs only through
# the API. A same-repo PR that edits this file runs its own copy on pull_request; only collaborators can open
# those (forks are skipped below). One run at a time per PR (a sweep is its own group): a newer waiting run
# replaces an older waiting one for the same PR, which loses nothing, and the script reads the alert marker again
# just before it posts, so two runs of one PR almost never post twice (only if both post in the same second).
name: owner-tap-alert

on:
  pull_request:
    branches: [next]
    # Not opened or synchronize: the head's checks have only just started, and their own ends dispatch this.
    types: [reopened, ready_for_review, labeled]
    paths: ['.github/**', 'scripts/lane-runner.py']
  workflow_dispatch:
    inputs:
      pr:
        description: 'Check only this PR (default: every open PR into next)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  checks: read
  statuses: read

concurrency:
  group: owner-tap-alert-${{ inputs.pr || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  alert:
    # The script ignores its own job by this name while it checks the head's other checks.
    name: owner-tap-alert
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: [self-hosted, Linux, sm-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Policy and code from the base, never PR code.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/owner_tap_alert.py
            scripts/comment_trust.py
          sparse-checkout-cone-mode: false
      - name: Alert the owner about PRs ready for his merge tap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MENTION: ${{ github.repository_owner }}
          ONLY_PR: ${{ inputs.pr }}
        run: python3 scripts/owner_tap_alert.py --base next --mention "$MENTION" ${ONLY_PR:+--pr "$ONLY_PR"}
