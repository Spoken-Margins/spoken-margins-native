# Push the owner's phone when a PR into next waits only for his merge tap (#2047).
#
# Only the owner merges a PR touching scripts/lane_merge_rules.py or .github/ (owner rule 2026-10-09). Agents
# post as the owner, and GitHub doesn't notify anyone of their own activity, so nothing told him one was ready:
# on 2026-10-18 #1964, #1966, #2038 and #1885 sat waiting only for his tap. scripts/owner_tap_alert.py posts one
# comment as github-actions[bot] that @mentions the owner, once per head, when such a PR is ready (not a draft,
# no conflict, head checks finished with none failed, no blocking Claude audit on the head). The GitHub mobile
# app pushes mentions.
#
# Where the alert is decided:
# - Mostly at the end of hosted-portable.yml (linux-t1.yml while LANE_HOSTED_FAST is off, #2442) and
#   shipped-build-compat.yml, in their own `owner-tap-alert` job, so it comes when a PR's checks finish. Their push event fires while the checks are still running, and check_suite,
#   workflow_run and workflow_dispatch all take their triggers from main, which doesn't carry this file until
#   #1492. After #1492 those jobs can move here as a `workflow_run` or `check_suite` trigger.
# - Here, when a PR touching those paths gets the `owner-tap-check` label, is marked ready for review or is
#   reopened. The label is how the Mac asks for a check: there `gh` is the owner, whose comment would notify
#   nobody, so the audit script (after auditing such a PR) and the Mac tick (optional backstop,
#   ops/lane/README.md) remove and re-add the label, and this run posts as the bot and removes it again.
#
# - Here too, on a push to the trunk that changes .github/workflows/ or the guard test (#2714): the alert needs the
#   `workflow files parse` check to have run since the base last changed those, so such a push can make an open PR
#   stale. The sweep strips `needs-owner-tap` from it and, if it was already alerted, warns once.
#
# The script is taken from the PR's base with no credentials kept, and reads PRs only through the API; a base
# without the script skips quietly. A same-repo PR that edits this file runs its own copy on pull_request; only
# collaborators can open those (forks are skipped below). One run at a time per PR, and the script reads the
# alert marker again just before it posts.
name: owner-tap-alert

on:
  pull_request:
    branches: [next, main]  # either trunk (#1492); the checks read the PR's own base
    # Not opened or synchronize: the head's checks have only just started, and their own last job decides.
    # `owner-tap` labeled or unlabeled: the PR is tapped (or not any more), so the list drops it or takes it back (#4939).
    types: [reopened, ready_for_review, labeled, unlabeled]
    paths: ['.github/**', 'scripts/lane_merge_rules.py']
  # The owner's review (2026-11-24): his approval of the head is his tap as the `owner-tap` label is
  # (scripts/owner_review_tap.py), so the list drops the PR when he approves and takes it back when his approval is
  # dismissed or he asks for changes. GitHub takes no `paths` filter here; the script reads the PR's files first.
  # Cost and catch: one Linux job of a few seconds, no Mac, no tokens, per review the owner submits or has dismissed
  # (anyone else's review skips the job); catches #5212, #5252 and #5256, approved on 2026-11-24 and still listed as
  # waiting for his tap. Waste signal: he keeps adding `owner-tap` anyway, and these runs never change the list.
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/tests/test_workflow_files.py']
  # A sweep of every open PR, so a PR whose last event came while it was not ready (mergeability still unknown, a check
  # still running) is labelled `needs-owner-tap` anyway (#4939). GitHub drops many scheduled runs, so this is the last
  # resort; the events above and claude-audit's dispatch do most of the work.
  schedule:
    - cron: '23,53 * * * *'
  # Refused by GitHub until main carries this file (#1492); kept so it works from then on.
  workflow_dispatch:
    inputs:
      pr:
        description: 'Check only this PR (default: every open PR into the trunk)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: read
  statuses: read

jobs:
  alert:
    # On the job, not the workflow (#4937): a run whose job is skipped (another label, an unarmed PR) never joins
    # the group, where it would replace a pending run that does the work (a group keeps only its newest pending run).
    concurrency:
      group: owner-tap-alert-${{ inputs.pr || github.event.pull_request.number || 'sweep' }}
      cancel-in-progress: false
    # The script ignores its own job by this name (the same in linux-t1.yml and shipped-build-compat.yml).
    name: owner-tap-alert
    # A label event counts only for owner-tap-check and owner-tap; lane labels come and go on these PRs all day.
    # A review counts only when it is the owner's (owner_review_tap.OWNER_LOGIN; a test keeps them equal).
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft &&
       (github.event_name != 'pull_request_review' || github.event.review.user.login == 'uncomposed') &&
       (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
        contains(fromJSON('["owner-tap-check","owner-tap"]'), github.event.label.name)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Policy and code from the base, never PR code.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/owner_tap_alert.py
            scripts/owner_review_tap.py
            scripts/comment_trust.py
            scripts/trunk.py
          sparse-checkout-cone-mode: false
      - name: Alert the owner about PRs ready for his merge tap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
          ONLY_PR: ${{ inputs.pr || github.event.pull_request.number }}
          CLEAR: ${{ github.event.label.name == 'owner-tap-check' && 'owner-tap-check' || '' }}
        run: |
          if [ ! -f scripts/owner_tap_alert.py ]; then
            echo "The base has no scripts/owner_tap_alert.py yet; nothing to check."
            exit 0
          fi
          python3 scripts/owner_tap_alert.py ${ONLY_PR:+--pr "$ONLY_PR"} ${CLEAR:+--clear-label "$CLEAR"}
