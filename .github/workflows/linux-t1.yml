# T1 on Linux: SessionKit's Foundation-only modules and their tests (SessionKitCoreTests), on a
# GitHub-hosted ubuntu runner, so every PR into next gets a red or green without the Mac and cloud
# sessions can run the same thing themselves (scripts/run-sessionkit-linux-tests.sh). See #316.
#
# The private repo has 2,000 free Linux minutes a month, so this job is kept lean:
# - one job, in the official Swift image, with the SwiftPM .build folder cached;
# - a newer push to the same PR cancels the run in progress;
# - the job summary reports the minutes each run used.
#
# Caches from pull_request runs are scoped to that PR, so the first run of each PR builds from
# scratch (~345 MB .build) and later pushes to it build incrementally.
name: linux-t1

on:
  pull_request:
    branches: [next]

permissions:
  contents: read

concurrency:
  group: linux-t1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sessionkit-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2-noble
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install libsqlite3
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev zstd > /dev/null
      # A full (shallow) checkout: the tests read fixtures from Contracts/, Site/ and research/.
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Packages/SessionKit/.build
          key: linux-t1-${{ hashFiles('Packages/SessionKit/Package.swift') }}-${{ github.sha }}
          restore-keys: linux-t1-${{ hashFiles('Packages/SessionKit/Package.swift') }}-
      - name: SessionKitCoreTests
        run: bash scripts/run-sessionkit-linux-tests.sh
      - name: Report minutes
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "linux-t1 took ${seconds}s (about $(( (seconds + 59) / 60 )) billed minutes, plus container setup)." | tee -a "$GITHUB_STEP_SUMMARY"
