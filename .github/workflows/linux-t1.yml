# T1 on Linux: SessionKit's Foundation-only modules and their tests (SessionKitCoreTests), so every
# PR into next gets a red or green without the Mac, and cloud sessions can run the same thing
# themselves (scripts/run-sessionkit-linux-tests.sh). See #316.
#
# It runs on the owner's VPS (runner sm-vps-t1), not GitHub-hosted ubuntu: the private repo's
# 2,000 free Linux minutes ran out on 2026-10-07 (#1023). The runner is set up so PR code can't
# reach the other VPS runner or the websites on the same box:
# - its own user (smt1), not in the docker group, so no `container:` here;
# - Swift 6.2.4 from swift.org (signature checked) in /opt/swift, on the runner's PATH;
# - systemd limits on the service (Nice 15, CPUWeight 20, MemoryMax 5G), so the sites keep priority.
# It has only the sm-vps-t1 label, so no other job lands on it.
#
# The build folder lives outside the checkout (actions/checkout's clean would delete it) and is
# kept between runs, so after the first cold build each PR builds incrementally. One runner means
# one job at a time; a newer push to the same PR cancels the run in progress.
#
# Fork PRs never run here (#1719): the job's `if` skips them, and the runner's own job-started hook
# (ops/runner-guard) refuses them even if a fork's copy of this file drops the `if`.
name: linux-t1

on:
  pull_request:
    branches: [next]

permissions:
  contents: read

concurrency:
  group: linux-t1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sessionkit-core:
    # Same-repo PRs only: a fork's PR would run its own code on the owner's VPS.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [sm-vps-t1]
    timeout-minutes: 45
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # A full (shallow) checkout: the tests read fixtures from Contracts/, Site/ and research/.
      - uses: actions/checkout@v4
      - name: SessionKitCoreTests
        run: bash scripts/run-sessionkit-linux-tests.sh --scratch-path "$HOME/sm-t1-build"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "linux-t1 took ${seconds}s on sm-vps-t1." | tee -a "$GITHUB_STEP_SUMMARY"

  owner-tap-alert-dispatch:
    # When SessionKitCoreTests finishes, start .github/workflows/owner-tap-alert.yml for this PR if only the owner merges it
    # (it touches .github/ or scripts/lane-runner.py; #2047). The workflow token may start a workflow_dispatch run,
    # the one event it is allowed to start, so the alert comes when the checks do, not on the next Mac tick. This
    # job runs no PR code and is the only one here that may start workflows. Moves to check_suite or workflow_run
    # in owner-tap-alert.yml once main carries workflows (#1492).
    needs: sessionkit-core
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, sm-vps]
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Start the owner-tap alert when this PR touches .github/ or scripts/lane-runner.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' \
              | grep -qE '^(\.github/|scripts/lane-runner\.py$)'; then
            gh workflow run owner-tap-alert.yml --repo "$GH_REPO" --ref next -f pr="$PR"
          else
            echo "PR $PR touches no owner-tap path; no alert to start."
          fi
