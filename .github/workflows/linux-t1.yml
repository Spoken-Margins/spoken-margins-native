# T1 on Linux: SessionKit's Foundation-only modules and their tests (SessionKitCoreTests), so every
# PR into next gets a red or green without the Mac, and cloud sessions can run the same thing
# themselves (scripts/run-sessionkit-linux-tests.sh). See #316.
#
# It runs on the owner's VPS (runner sm-vps-t1), not GitHub-hosted ubuntu: the private repo's
# 2,000 free Linux minutes ran out on 2026-10-07 (#1023). The runner is set up so PR code can't
# reach the other VPS runner or the websites on the same box:
# - its own user (smt1), not in the docker group, so no `container:` here;
# - Swift 6.2.4 from swift.org (signature checked) in /opt/swift, on the runner's PATH;
# - systemd limits on the service (Nice 15, CPUWeight 20, MemoryMax 5G), so the sites keep priority.
# It has only the sm-vps-t1 label, so no other job lands on it.
#
# The build folder lives outside the checkout (actions/checkout's clean would delete it) and is
# kept between runs, so after the first cold build each PR builds incrementally. One runner means
# one job at a time; a newer push to the same PR cancels the run in progress.
#
# The `portable` job (#2160) runs the fast plan's portable half here too (--plan fast-portable, as hosted-portable.yml
# will once the repo is public). Both jobs record what they tested (`lane-hosted-tested`, GitHub's merge commit's
# tree and parents); when both passed on the PR's head, the lane's automerge run (lane-runner.py VPS_FAST_CHECKS)
# runs only --plan fast-mac-rest on the Mac instead of the whole --plan fast. They queue on the one runner.
#
# Fork PRs never run here (#1719): the job's `if` skips them, and the runner's own job-started hook
# (ops/runner-guard) refuses them even if a fork's copy of this file drops the `if`.
name: linux-t1

on:
  pull_request:
    branches: [next, main]  # either trunk (#1492); the checks read the PR's own base
    # Docs-only PRs are T0 (scripts/test-scope.py): the lane runs nothing for them and never waits for these checks.
    paths-ignore: ['**/*.md', 'docs/**', 'research/**', 'Design/**', 'references/**', 'Site/**', 'Contracts/docs/**']

permissions:
  contents: read

concurrency:
  group: linux-t1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sessionkit-core:
    # Same-repo PRs only: a fork's PR would run its own code on the owner's VPS.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [sm-vps-t1]
    timeout-minutes: 45
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # A full (shallow) checkout: the tests read fixtures from Contracts/, Site/ and research/.
      - uses: actions/checkout@v4
      - name: SessionKitCoreTests
        run: bash scripts/run-sessionkit-linux-tests.sh --scratch-path "$HOME/sm-t1-build"
      - name: Record what was tested, for the lane runner
        run: |
          # GitHub's merge commit: parent 1 is next, parent 2 the PR's head. The runner matches the tree.
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          echo "::notice title=lane-hosted-tested::plan=linux-sessionkit-core tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "linux-t1 took ${seconds}s on sm-vps-t1." | tee -a "$GITHUB_STEP_SUMMARY"

  portable:
    # The fast plan's Python, Node and Go steps (#2160). A shallow checkout without LFS, like hosted-portable.yml.
    name: 'vps fast: portable'
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [sm-vps-t1]
    timeout-minutes: 30
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: research/B4/server/go.mod
      - name: Python tools and Node packages
        run: |
          bash scripts/bootstrap-python-tools.sh
          npm ci
      - name: Portable fast plan
        run: .venv/bin/python scripts/verify-tests.py --plan fast-portable
      # The step logs stay on the VPS; a red run shows which tests failed here.
      - name: Show what failed
        if: failure()
        run: |
          for log in artifacts/test-runs/*-fast-portable/*.log; do
            grep -E '^(FAIL|ERROR):|^[A-Za-z]*Error:|^FAILED|^Ran ' "$log" | head -60 | sed "s|^|$(basename "$log"): |"
          done
      - name: Record what was tested, for the lane runner
        run: |
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          echo "::notice title=lane-hosted-tested::plan=fast-portable tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "vps fast portable took ${seconds}s on sm-vps-t1." | tee -a "$GITHUB_STEP_SUMMARY"

  owner-tap-alert:
    # When both jobs above finish, tell the owner's phone if this PR now waits only for his merge tap (#2047):
    # scripts/owner_tap_alert.py posts one github-actions[bot] comment that @mentions him, once per head, when the
    # PR touches .github/ or scripts/lane-runner.py and is ready. It runs here, not as a dispatched workflow,
    # because GitHub reads dispatch triggers from main, which doesn't carry owner-tap-alert.yml until #1492. The
    # script comes from the PR's base with no credentials kept, never from the PR, and this is the only job here
    # whose token may comment. A base that doesn't have the script yet skips quietly.
    name: owner-tap-alert
    needs: [sessionkit-core, portable]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, sm-vps]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/owner_tap_alert.py
            scripts/comment_trust.py
            scripts/trunk.py
          sparse-checkout-cone-mode: false
      - name: Alert the owner if this PR is ready for his merge tap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f scripts/owner_tap_alert.py ]; then
            echo "The base has no scripts/owner_tap_alert.py yet; nothing to check."
            exit 0
          fi
          python3 scripts/owner_tap_alert.py --pr "$PR"
