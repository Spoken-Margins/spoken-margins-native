# Hosted portable checks (#1847, #1389): the fast plan's Python and Node steps on a GitHub-hosted ubuntu runner,
# so the Mac doesn't spend a slot on them. `scripts/verify-tests.py --plan fast-portable` runs the runner tests
# (without the ones that drive Apple tools), the ops tests (without ops/disk), the contract and surface
# validators, the test inventory, the browser-extraction and share-link suites, and the research suites. It
# prints each step it leaves out and a host test fails if a fast-plan step is in neither list.
# The second job, `sessionkit`, runs `--plan fast-hosted-sessionkit` on a GitHub-hosted Mac: SessionKit's build and
# SessionKitCoreTests. The third, `mac-rest` (#2459), runs `--plan fast-mac-rest` on another GitHub-hosted Mac with
# the BlackHole virtual audio output installed: what neither of the others runs (SessionKitTests and
# SessionKitTraceTests, which need a sound output, the shipped-build compatibility checks, and the runner and ops
# tests that drive Apple tools). With all three passed on the merge commit, the lane's automerge job runs on hosted
# Linux, tests nothing itself and merges, so merging takes no Mac. On a PR it runs only with the repository variable
# LANE_HOSTED_MAC_REST `on` as well (a rollout guard like LANE_HOSTED_FAST); unset, the automerge job waits on hosted
# Linux for the two jobs above, then hands the run to the build Mac, which runs fast-mac-rest there. A dispatch always runs it, so it can be proved before the switch goes on.
#
# Per PR, only once the lane takes hosted results (#1389): the pull_request trigger is here, but both jobs are
# skipped, and cost nothing, until the repository variable LANE_HOSTED_FAST is `on`. The private repo's free
# minutes ran out on 2026-10-07 (#1023); once the repo is public, standard hosted runners are free and the lead
# sets the variable (`gh variable set LANE_HOSTED_FAST --body on`). The same variable tells the lane runner
# (lane.yml) to accept these two PASSes on the merge commit it would push and run only `--plan fast-mac-rest` on
# the Mac. Unset or anything else, the lane runs the whole --plan fast on the Mac as before.
# On a PASS each job records what it tested as a notice annotation (`lane-hosted-tested`): the merge commit's tree
# and its two parents (the base, then the PR's head). The runner reads it from the check run and matches the tree
# against its own merge (lane-runner.py hosted_fast_checks).
#
# Scope (#2596): the two Mac jobs wait for the `scope` job (hosted Linux, about 20 seconds), which asks
# scripts/test-scope.py mac_checks_required whether the diff reaches a Swift input. If every changed path is one the
# Mac checks can ignore (docs, ops, most scripts, non-Swift tooling), both Mac jobs are skipped and cost no hosted-Mac
# minute; lane-runner.py asks the same function and then merges on the portable check alone. A skipped job is not a
# pass: its check run ends `skipped`, which the runner never reads as one. Unknown paths, a dispatch without a base
# and any trouble reading the diff all say `mac=true`.
#
# One Mac job (#2596): with LANE_HOSTED_MAC_REST `on`, `mac-rest` runs SessionKit's build and SessionKitCoreTests
# (`--plan fast-hosted-sessionkit`) and then `--plan fast-mac-rest` on the same hosted Mac, and records one notice,
# for both plans (`plan=fast-hosted-sessionkit+fast-mac-rest`), under its stable check name. The `sessionkit` job above then does not run (a second machine
# start, checkout, cache restore and SessionKit build for about the same tests), and the runner requires only the
# portable check and "hosted fast: Mac rest". With the variable off, `sessionkit` runs alone as before.
#
# Dispatch it by hand on any branch with `gh workflow run hosted-portable.yml --ref <branch>`.
#
# No secrets, a read-only token, no pull_request_target, no Git LFS (the voice models stay pointers; the
# contracts step checks each pointer's recorded size and hash against the manifest; SessionKit reads no LFS file).
name: hosted-portable

on:
  workflow_dispatch:
    inputs:
      base:
        # #2459: the hosted automerge job dispatches this on a PR's branch when the PR's own checks tested an older
        # base that has since moved in ways that matter (lane-runner.py hosted_rest_checks). Each job then tests the
        # dispatched commit merged onto the base's tip, with the base as parent 1 as in GitHub's merge commit, and
        # records it as for a PR. Empty: test the dispatched commit as it is, and record nothing.
        description: 'Test the commit merged onto this base branch (e.g. main) and record it for the lane'
        required: false
        type: string
        default: ''
  pull_request:
    branches: [next, main]  # either trunk (#1492); the checks read the PR's own base
    # Docs-only PRs are T0 (scripts/test-scope.py): the lane runs nothing for them and never waits for these checks.
    paths-ignore: ['**/*.md', 'docs/**', 'research/**', 'Design/**', 'references/**', 'Site/**', 'Contracts/docs/**']

permissions:
  contents: read

concurrency:
  group: hosted-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    # Same-repo PRs only: a fork's PR would run its own code (here on a GitHub machine with no secrets, but the
    # same guard as every other job keeps the rule in one place). Always true for workflow_dispatch.
    # And, for a PR, only once the lane takes hosted results (LANE_HOSTED_FAST, above).
    name: 'hosted fast: portable'
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # A shallow checkout without LFS: nothing here needs the app's voice models.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # A dispatch with a base merges it in below, which needs the history back to the merge base.
          fetch-depth: ${{ inputs.base == '' && 1 || 0 }}
      - name: Merge the base in (dispatch with a base)
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          # As GitHub's merge commit: the base's tip is parent 1, the dispatched commit parent 2. A conflict fails.
          head=$(git rev-parse HEAD)
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git checkout --quiet --detach "refs/remotes/origin/$BASE"
          git -c user.name=lane -c user.email=lane@users.noreply.github.com merge --quiet --no-ff --no-edit "$head"
          git log --oneline -1
      # pip's and npm's download caches, keyed on the lock files (#1389).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # research/B4/server's tests. Its go.mod `toolchain` line names the exact
      # patch release; setup-go v5's go-version-file reads only the `go` line
      # (the minimum), so read the toolchain line here instead.
      - name: Read the Go toolchain from go.mod
        id: gotool
        run: |
          v=$(sed -n 's/^toolchain go//p' research/B4/server/go.mod)
          [ -n "$v" ] || { echo "no toolchain line in go.mod" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.gotool.outputs.version }}
      # test-edit-caddyfile.sh validates every candidate Caddyfile and serves it only when CADDY and SMSERVER are
      # set; without them it passes "but not the Caddy ones", and the step is red on this runner (#2605). The
      # tarball is pinned by version and checked against its published SHA-512.
      - name: Caddy and smserver for the Caddyfile tests
        run: |
          version=2.11.7
          sha512=a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
          curl -fsSL -o "$RUNNER_TEMP/caddy.tar.gz" "https://github.com/caddyserver/caddy/releases/download/v${version}/caddy_${version}_linux_amd64.tar.gz"
          echo "$sha512  $RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          (cd research/B4/server && go build -o "$RUNNER_TEMP/smserver" ./cmd/smserver)
          echo "CADDY=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
          echo "SMSERVER=$RUNNER_TEMP/smserver" >> "$GITHUB_ENV"
      - name: Python tools and Node packages
        run: |
          bash scripts/bootstrap-python-tools.sh
          npm ci
      - name: Portable fast plan
        run: .venv/bin/python scripts/verify-tests.py --plan fast-portable
      # The machine is gone after the job: keep the per-step logs so a red run names its failing tests.
      - name: Keep the step logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-portable-test-runs
          path: artifacts/test-runs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record what was tested, for the lane runner
        if: success() && (github.event_name == 'pull_request' || inputs.base != '')
        run: |
          # GitHub's merge commit: parent 1 is the base, parent 2 the PR's head. The runner matches the tree.
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          echo "::notice title=lane-hosted-tested::plan=fast-portable tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "hosted-portable took ${seconds}s on ubuntu-latest." | tee -a "$GITHUB_STEP_SUMMARY"

  scope:
    # #2596: one cheap Linux job decides whether the Mac jobs below have anything to test. Runs the PR's own merge
    # commit's copy of test-scope.py with no credentials and no write token; its only output is `mac`.
    name: 'hosted fast: scope'
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.scope.outputs.mac }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Do the Mac checks have anything to test?
        id: scope
        env:
          BASE: ${{ inputs.base }}
        run: |
          # A PR: the merge commit's parent 1 is the base, parent 2 the PR's head (the changed-files rule of the
          # Mac rest job). A dispatch with a base: the dispatched commit against that base's tip. A dispatch without
          # a base has no diff to look at, so the Mac checks run.
          list="$RUNNER_TEMP/changed-files.txt"
          if git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            git diff --name-only --no-renames "$(git merge-base HEAD^1 HEAD^2)" HEAD^2 > "$list" || rm -f "$list"
          elif [ -n "$BASE" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" &&
              git diff --name-only --no-renames "$(git merge-base HEAD "refs/remotes/origin/$BASE")" HEAD > "$list" || rm -f "$list"
          fi
          if [ -s "$list" ]; then
            python3 scripts/test-scope.py --mac-required "$list" | tee -a "$GITHUB_OUTPUT" || echo "mac=true" >> "$GITHUB_OUTPUT"
          else
            { echo "mac=true"; echo "reason=no changed-file list, so the Mac checks run"; } | tee -a "$GITHUB_OUTPUT"
          fi
          grep -q '^mac=' "$GITHUB_OUTPUT" || echo "mac=true" >> "$GITHUB_OUTPUT"

  sessionkit:
    name: 'hosted fast: SessionKit core'
    needs: scope
    # Not with LANE_HOSTED_MAC_REST `on`: the mac-rest job below runs these tests then (#2596).
    if: >-
      !cancelled() && needs.scope.result != 'skipped' && needs.scope.outputs.mac != 'false' && vars.LANE_HOSTED_MAC_REST != 'on' && (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on'))
    # The image and Xcode the lane Mac builds with (hosted-app-macos.yml says why), so the two can't disagree.
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      # The Mac-wide host-test slots (lane_slots.py) live in the state folder: this machine is the job's alone.
      - name: Start the clock
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "SM_LANE_STATE_DIR=$RUNNER_TEMP/lane-state" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # A dispatch with a base merges it in below, which needs the history back to the merge base.
          fetch-depth: ${{ inputs.base == '' && 1 || 0 }}
      - name: Merge the base in (dispatch with a base)
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          # As GitHub's merge commit: the base's tip is parent 1, the dispatched commit parent 2. A conflict fails.
          head=$(git rev-parse HEAD)
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git checkout --quiet --detach "refs/remotes/origin/$BASE"
          git -c user.name=lane -c user.email=lane@users.noreply.github.com merge --quiet --no-ff --no-edit "$head"
          git log --oneline -1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The package's build folder: dependency checkouts (onnxruntime's binary framework is the big one) and their
      # products. Our own sources are always newer than the restored objects, so only the dependencies are reused.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Packages/SessionKit/.build
          key: sessionkit-macos-xcode27.0-${{ hashFiles('Packages/SessionKit/Package.swift', 'Packages/SessionKit/Package.resolved') }}
          restore-keys: sessionkit-macos-xcode27.0-
      # The test inventory check at startup loads the contract validator, which needs jsonschema (#1389).
      - name: Python tools
        run: bash scripts/bootstrap-python-tools.sh
      - name: SessionKit build and SessionKitCoreTests
        run: |
          swift --version
          .venv/bin/python scripts/verify-tests.py --plan fast-hosted-sessionkit
      - name: Keep the step logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-sessionkit-test-runs
          path: artifacts/test-runs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record what was tested, for the lane runner
        if: success() && (github.event_name == 'pull_request' || inputs.base != '')
        run: |
          # GitHub's merge commit: parent 1 is the base, parent 2 the PR's head. The runner matches the tree.
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          echo "::notice title=lane-hosted-tested::plan=fast-hosted-sessionkit tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "hosted fast SessionKit core took ${seconds}s on xcode-27." | tee -a "$GITHUB_STEP_SUMMARY"

  mac-rest:
    # #2459: --plan fast-mac-rest, which the lane's automerge job used to run on the owner's build Mac (about 8 minutes
    # a PR, behind a queue of up to 21 jobs on 2026-10-22). Same PRs and paths as the two jobs above, once
    # LANE_HOSTED_MAC_REST is `on` too; lane.yml then routes the automerge job to hosted Linux.
    # Not yet on (2026-10-22): on this image (macOS 27; run 39831658469) 996 of 998 tests passed, but two depend on the
    # OS: SystemNarrationRateTests heard Samantha at 0.5x as 0.63x (its rate table was measured on macOS 26, the lane
    # Mac's), and RealSpeechTranscriberTests skipped, with no en_US SpeechTranscriber model. macos-26 matches the lane
    # Mac's OS but has no Xcode 27, and Xcode 26.6 does not compile SessionKit's tests (run 39836269608). #2469 tracks it.
    name: 'hosted fast: Mac rest'
    needs: scope
    if: >-
      !cancelled() && needs.scope.result != 'skipped' && needs.scope.outputs.mac != 'false' && (github.event_name != 'pull_request' ||
      ((github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on') &&
       vars.LANE_HOSTED_MAC_REST == 'on'))
    runs-on: xcode-27
    # SessionKit's build (cached dependencies) and SessionKitCoreTests (the `sessionkit` job's 40 minutes before they
    # moved here, #2596), its two serial targets, and the compatibility checks when the diff reaches them (the lane's
    # own budget for those is 40 minutes).
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Start the clock
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "SM_LANE_STATE_DIR=$RUNNER_TEMP/lane-state" >> "$GITHUB_ENV"
      # Whole history and tags: the compatibility checks read the shipped build's tag, and the changed-file list
      # below needs the merge base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Merge the base in (dispatch with a base)
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          # As GitHub's merge commit: the base's tip is parent 1, the dispatched commit parent 2. A conflict fails.
          head=$(git rev-parse HEAD)
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git checkout --quiet --detach "refs/remotes/origin/$BASE"
          git -c user.name=lane -c user.email=lane@users.noreply.github.com merge --quiet --no-ff --no-edit "$head"
          git log --oneline -1
      # The voice models are LFS files the SessionKit voice tests read. The same cache hosted-app-macos.yml keeps on
      # the trunk, so a PR's run restores it instead of spending the LFS bandwidth quota.
      - name: List LFS objects
        run: mkdir -p .build && git lfs ls-files --long | cut -d' ' -f1 | sort > .build/lfs-ids.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.build/lfs-ids.txt') }}
          restore-keys: lfs-
      - name: Fetch LFS files
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Packages/SessionKit/.build
          key: sessionkit-macos-xcode27.0-${{ hashFiles('Packages/SessionKit/Package.swift', 'Packages/SessionKit/Package.resolved') }}
          restore-keys: sessionkit-macos-xcode27.0-
      - name: Python tools
        run: bash scripts/bootstrap-python-tools.sh
      # Before BlackHole, as the `sessionkit` job ran them (#2596). The second plan's build is then incremental.
      - name: SessionKit build and SessionKitCoreTests
        run: |
          swift --version
          .venv/bin/python scripts/verify-tests.py --plan fast-hosted-sessionkit
      # Hosted Macs have no audio hardware, and AVPlayer's clock does not move without a running output (#909).
      # BlackHole gives Core Audio one. brew refuses to run as root; the cask's installer asks for sudo itself,
      # which is passwordless on hosted runners. verify-tests.py checks the output starts before the audio tests.
      - name: Install BlackHole (virtual audio output)
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          # Core Audio picks up a new driver only after it restarts.
          sudo killall coreaudiod || true
          sleep 5
          SwitchAudioSource -t output -s "BlackHole 2ch"
          SwitchAudioSource -t output -c | sed 's/^/Default output: /' | tee -a "$GITHUB_STEP_SUMMARY"
      # What the lane's own run gets (lane-runner.py changed_paths_for_tests): every path the PR changes against its
      # merge base with the base, both sides of a rename. A dispatch without a base runs every step.
      - name: Changed files
        run: |
          if git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            git diff --name-only --no-renames "$(git merge-base HEAD^1 HEAD^2)" HEAD^2 > "$RUNNER_TEMP/changed-files.txt"
            echo "CHANGED_ARGS=--changed-files $RUNNER_TEMP/changed-files.txt" >> "$GITHUB_ENV"
            echo "$(grep -c . "$RUNNER_TEMP/changed-files.txt" || true) changed files"
          else
            echo "Not a merge commit: every fast-mac-rest step runs."
          fi
      - name: Mac rest of the fast plan
        run: |
          swift --version
          .venv/bin/python scripts/verify-tests.py --plan fast-mac-rest $CHANGED_ARGS
      - name: Keep the step logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-mac-rest-test-runs
          path: artifacts/test-runs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record what was tested, for the lane runner
        if: success() && (github.event_name == 'pull_request' || inputs.base != '')
        run: |
          # GitHub's merge commit: parent 1 is the base, parent 2 the PR's head. The runner matches the tree.
          # Both plans in the name: an older job's plan=fast-mac-rest ran no core tests and must not stand for them.
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          echo "::notice title=lane-hosted-tested::plan=fast-hosted-sessionkit+fast-mac-rest tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "hosted fast Mac rest took ${seconds}s on xcode-27." | tee -a "$GITHUB_STEP_SUMMARY"

  owner-tap-alert:
    # When the jobs above finish, tell the owner's phone if this PR now waits only for his merge tap (#2047, #2442):
    # scripts/owner_tap_alert.py posts one github-actions[bot] comment that @mentions him, once per head, when the
    # PR touches .github/ or scripts/lane-runner.py and is ready. It moved here from linux-t1.yml (retired, #2442),
    # whose one VPS runner held it in a queue for an hour or more. With LANE_HOSTED_FAST off the two jobs above are
    # skipped and this runs at once; another workflow's alert job or the owner-tap-check label then decides. It runs
    # on its own GitHub-hosted machine, apart from the jobs that run PR code. The script comes from the PR's base with
    # no credentials kept, never from the PR, and this is the only job here whose token may comment. A base that
    # doesn't have the script yet skips quietly. Pull requests from this repository only.
    name: owner-tap-alert
    needs: [portable, scope, sessionkit, mac-rest]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/owner_tap_alert.py
            scripts/comment_trust.py
            scripts/trunk.py
          sparse-checkout-cone-mode: false
      - name: Alert the owner if this PR is ready for his merge tap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f scripts/owner_tap_alert.py ]; then
            echo "The base has no scripts/owner_tap_alert.py yet; nothing to check."
            exit 0
          fi
          python3 scripts/owner_tap_alert.py --pr "$PR"
