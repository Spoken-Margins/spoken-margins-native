# Hosted portable checks (#1847, #1389): the fast plan's Python and Node steps on a GitHub-hosted ubuntu runner,
# so the Mac doesn't spend a slot on them. `scripts/verify-tests.py --plan fast-portable` runs the runner tests
# (without the ones that drive Apple tools), the ops tests (without ops/disk), the contract and surface
# validators, the test inventory, the browser-extraction and share-link suites, and the research suites. It
# prints each step it leaves out and a host test fails if a fast-plan step is in neither list. The same job builds
# SessionKit's Linux targets and runs SessionKitCoreTests in the swift image (#3529), so a red test frees the Mac early.
# On a PR push (2026-11-20) the job runs a quick tier instead: the plan with --pr-quick (no runner-tests) and no Linux
# SessionKitCoreTests; the merge group and dispatches run everything (see the "Portable fast plan" step).
# The second job, `sessionkit`, runs `--plan fast-hosted-sessionkit` on a GitHub-hosted Mac: SessionKit's build and
# SessionKitCoreTests. The third, `mac-rest` (#2459), runs `--plan fast-mac-rest` on another GitHub-hosted Mac with
# the BlackHole virtual audio output installed: what neither of the others runs (SessionKitTests and
# SessionKitTraceTests, which need a sound output, the shipped-build compatibility checks, and the runner and ops
# tests that drive Apple tools). With all three passed on the merge commit, the lane's automerge job runs on hosted
# Linux, tests nothing itself and merges, so merging takes no Mac. On a PR it runs only with the repository variable
# LANE_HOSTED_MAC_REST `on` as well (a rollout guard like LANE_HOSTED_FAST); unset, the automerge job waits on hosted
# Linux for the two jobs above, then hands the run to the build Mac, which runs fast-mac-rest there. A dispatch always runs it, so it can be proved before the switch goes on.
#
# Per PR, only once the lane takes hosted results (#1389): the pull_request trigger is here, but both jobs are
# skipped, and cost nothing, until the repository variable LANE_HOSTED_FAST is `on`. The private repo's free
# minutes ran out on 2026-10-07 (#1023); once the repo is public, standard hosted runners are free and the lead
# sets the variable (`gh variable set LANE_HOSTED_FAST --body on`). The same variable tells the lane runner
# (lane.yml) to accept these two PASSes on the merge commit it would push and run only `--plan fast-mac-rest` on
# the Mac. Unset or anything else, the lane runs the whole --plan fast on the Mac as before.
# On a PASS each job records what it tested as a notice annotation (`lane-hosted-tested`): the merge commit's tree
# and its two parents (the base, then the PR's head). The runner reads it from the check run and matches the tree
# against its own merge (lane-runner.py hosted_fast_checks).
#
# Scope (#2596): the two Mac jobs wait for the `scope` job (hosted Linux, about 20 seconds), which asks
# the base branch's scripts/test-scope.py mac_checks_required whether the diff reaches a Swift input. If every changed path is one the
# Mac checks can ignore (docs, ops, most scripts, non-Swift tooling), both Mac jobs are skipped and cost no hosted-Mac
# minute; lane-runner.py asks the same function and then merges on the portable check alone. A skipped job is not a
# pass: its check run ends `skipped`, which the runner never reads as one. Unknown paths, a dispatch without a base
# and any trouble reading the diff all say `mac=true`.
#
# One Mac job (#2596): with LANE_HOSTED_MAC_REST `on`, `mac-rest` runs SessionKit's build and SessionKitCoreTests
# (`--plan fast-hosted-sessionkit`) and then `--plan fast-mac-rest` on the same hosted Mac, and records one notice,
# for both plans (`plan=fast-hosted-sessionkit+fast-mac-rest`), under its stable check name. The `sessionkit` job above then does not run (a second machine
# start, checkout, cache restore and SessionKit build for about the same tests), and the runner requires only the
# portable check and "hosted fast: Mac rest". With the variable off, `sessionkit` runs alone as before.
#
# When the Linux job fails, the `stop-macs-on-red` job cancels the run, so the Mac jobs of the merged layout (`scope`,
# then `mac-rest`, or `sessionkit` with the variable off) stop or leave the queue (#2596): a PR the cheap job
# already fails has no use for a hosted-Mac slot, and the org has five of them.
#
# The slow tier (#5145, owner 2026-11-23): every plan here runs with --leave-out-slow, which leaves out the tests in
# scripts/slow_tier.py (slow on these runners, no failure in 30 days, none a packet, database or owner-data guard) and
# names them in the log. main-slow.yml runs exactly those on main nightly and before the phone builds.
#
# Dispatch it by hand on any branch with `gh workflow run hosted-portable.yml --ref <branch>`.
#
# No secrets, a read-only token, no pull_request_target, no Git LFS (the voice models stay pointers; the
# contracts step checks each pointer's recorded size and hash against the manifest; SessionKit reads no LFS file).
name: hosted-portable

on:
  workflow_dispatch:
    inputs:
      base:
        # #2459: the hosted automerge job dispatches this on a PR's branch when the PR's own checks tested an older
        # base that has since moved in ways that matter (lane-runner.py hosted_rest_checks). Each job then tests the
        # dispatched commit merged onto the base's tip, with the base as parent 1 as in GitHub's merge commit, and
        # records it as for a PR. Empty: test the dispatched commit as it is, and record nothing.
        description: 'Test the commit merged onto this base branch (e.g. main) and record it for the lane'
        required: false
        type: string
        default: ''
  pull_request:
    branches: [next, main]  # either trunk (#1492); the checks read the PR's own base
    # No paths filter: a required check must report on every PR and every merge group, and a workflow a paths filter
    # skips leaves its checks pending, which would block the merge queue. Docs-only changes (the old paths-ignore
    # list) are now skipped at the job level by the `scope` job's `docs_only` output; a skipped job reports success.
  # GitHub's merge queue (#4693): each queued entry is tested here as main plus the PRs ahead of it plus itself, on a
  # gh-readonly-queue/main/... branch. Harmless until the "protect main" ruleset requires the queue.
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosted-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    # Same-repo PRs only: a fork's PR would run its own code (here on a GitHub machine with no secrets, but the
    # same guard as every other job keeps the rule in one place). Always true for workflow_dispatch.
    # And, for a PR, only once the lane takes hosted results (LANE_HOSTED_FAST, above).
    name: 'hosted fast: portable'
    # Waits for `scope` (about 20 seconds) only to learn whether the change is docs-only. A merge group always runs:
    # the queue merges every entry ahead of a green head on that head's result (HEADGREEN grouping), so a skip here
    # merged untested PRs ahead of a docs-only head on 2026-11-23 (#5179). Groups are few and this job is Linux.
    needs: scope
    if: >-
      !cancelled() && needs.scope.result == 'success' &&
      (github.event_name == 'merge_group' || needs.scope.outputs.docs_only != 'true') &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on'))
    runs-on: ubuntu-latest
    # Successful runs take 20 to 29 minutes, so a 30-minute limit cancelled busy runs that were passing; in the merge
    # queue that drops a PR for no real failure (#4693, 2026-11-20). The limit is a ceiling, not a pace.
    timeout-minutes: 45
    outputs:
      # The SessionKitCoreTests that passed only on their Linux rerun, for linux-retry-tally (#2176).
      retried: ${{ steps.core.outputs.retried }}
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # A shallow checkout without LFS: nothing here needs the app's voice models.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # A dispatch with a base merges it in below, which needs the history back to the merge base.
          fetch-depth: ${{ inputs.base == '' && 1 || 0 }}
      - name: Merge the base in (dispatch with a base)
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          # As GitHub's merge commit: the base's tip is parent 1, the dispatched commit parent 2. A conflict fails.
          head=$(git rev-parse HEAD)
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git checkout --quiet --detach "refs/remotes/origin/$BASE"
          git -c user.name=lane -c user.email=lane@users.noreply.github.com merge --quiet --no-ff --no-edit "$head"
          git log --oneline -1
      # pip's and npm's download caches, keyed on the lock files (#1389).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # research/B4/server's tests. Its go.mod `toolchain` line names the exact
      # patch release; setup-go v5's go-version-file reads only the `go` line
      # (the minimum), so read the toolchain line here instead.
      - name: Read the Go toolchain from go.mod
        id: gotool
        run: |
          v=$(sed -n 's/^toolchain go//p' research/B4/server/go.mod)
          [ -n "$v" ] || { echo "no toolchain line in go.mod" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.gotool.outputs.version }}
      # test-edit-caddyfile.sh validates every candidate Caddyfile and serves it only when CADDY and SMSERVER are
      # set; without them it passes "but not the Caddy ones", and the step is red on this runner (#2605). The
      # tarball is pinned by version and checked against its published SHA-512.
      - name: Caddy and smserver for the Caddyfile tests
        run: |
          version=2.11.7
          sha512=a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
          curl -fsSL -o "$RUNNER_TEMP/caddy.tar.gz" "https://github.com/caddyserver/caddy/releases/download/v${version}/caddy_${version}_linux_amd64.tar.gz"
          echo "$sha512  $RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          (cd research/B4/server && go build -o "$RUNNER_TEMP/smserver" ./cmd/smserver)
          echo "CADDY=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
          echo "SMSERVER=$RUNNER_TEMP/smserver" >> "$GITHUB_ENV"
      - name: Python tools and Node packages
        run: |
          bash scripts/bootstrap-python-tools.sh
          npm ci
      # PR quick tier (2026-11-20): on a PR push this job is the first signal, so it runs only the cheap portable steps
      # (--pr-quick leaves runner-tests out) and skips the Linux SessionKitCoreTests below. The merge group, which
      # every PR must pass to merge, runs the whole plan and the Linux tests, as do dispatches. Measured from 17 PR runs
      # and 14 merge groups after MERGE_QUEUE_MAC went queue-only (scripts/ci_step_budgets.py profile): on a PR this
      # job took 28 minutes at p50, runner-tests 1,180 s at p95 and the Linux core tests 512 s at p50, and the other
      # portable steps about 90 s together.
      # Cost and catch: saves about 25 hosted Linux minutes per PR push, and the PR's first test result comes in about
      # 4 minutes instead of 28. What it can cost: a PR that breaks runner-tests or a Linux-only SessionKit test now
      # learns it in the merge group, which drops it and retests the PRs behind it (about 58 job-minutes a group).
      # Waste signal: in a month, merge groups that failed on runner-tests or the Linux core tests, times 58 minutes,
      # outweigh 25 minutes times the PR pushes; then run the whole plan on PRs again.
      - name: Portable fast plan
        env:
          PR_QUICK: ${{ github.event_name == 'pull_request' && '--pr-quick' || '' }}
        run: .venv/bin/python scripts/verify-tests.py --plan fast-portable $PR_QUICK --leave-out-slow
      # #4937: the pipeline harness. It runs this tree's workflows, queue scripts, merge policy and VPS backstop through
      # about 400 timed combinations (black-box Mac jobs that pass, fail, hang or never start; same-second label bursts in
      # both orders; download outages; token refusals; dropped schedules) and fails on a stuck, silent, looping or
      # broken-merge case not in its KNOWN list, or on a KNOWN entry that no longer happens.
      # Cost and catch: about 30 seconds of a hosted Linux job per PR push and per merge group, no Mac, no tokens. It
      # runs on every PR rather than on a path list, because a path list is one more thing to fall out of date and the
      # harness reads scripts no list would name. Replayed against the last two days, it finds #4929 (a re-arm left the
      # required check cancelled for 2 to 5 hours), the bridge's silent 403, the disarmed timed-out queue entry, the
      # grey cancelled portable check (#4747) and the skipped-means-passed web check (docs/workstreams/ci-model.md).
      # Waste signal: three months in which it never fails a PR, or it passes 2 minutes; then run it only on pipeline
      # paths.
      - name: Pipeline harness
        run: .venv/bin/python scripts/ci_harness.py --check
      # #2681: SessionKit also builds on Linux (the daily Substack canary runs on it), but no per-PR check compiled it
      # there, so #2671's Foundation-only `.bySentences` broke the Linux build on main unnoticed. #3529: and it runs
      # SessionKitCoreTests here, in the same swift image and dependency cache as hosted-sessionkit-linux.yml, so a red
      # test fails this check, which the lane reads, and stop-macs-on-red frees the PR's hosted-Mac slot. The Mac jobs
      # keep their own run of these tests. scripts/linux_core_tests.py reruns a failed run once (owner, 2026-10-24),
      # and the linux-retry-tally job below tallies a pass on the rerun on #2176.
      # After the portable plan, not before: the two fail about equally often (17 and 17 of the last 60 failed runs on
      # 2026-11-06), and the plan's tree-walking checks then never see the root-owned build folder.
      # Cost and catch: the build was already here; the tests add 2 to 3 free hosted Linux minutes per PR, which a PR
      # that needs no Mac also waits for. It would have caught #2681, and, ahead of the Mac, #3490's SharedMarginAudioGuardTests failure.
      # What it can cost: a test that fails only on Linux now blocks a merge. Waste signal: three months in which no
      # PR's first red is here, or the tests pass 5 minutes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name != 'pull_request'
        with:
          path: .build-linux
          key: sessionkit-linux-swift6.2.4-${{ hashFiles('Packages/SessionKit/Package.swift', 'Packages/SessionKit/Package.resolved') }}
          restore-keys: sessionkit-linux-swift6.2.4-
      - name: SessionKitCoreTests on Linux
        id: core
        # The merge group runs them; a PR's quick tier does not (above).
        if: github.event_name != 'pull_request'
        run: .venv/bin/python scripts/linux_core_tests.py run
      # What this job ran, by name, to set beside the Mac's list: scripts/linux_core_tests.py compare (#3529). The
      # Mac's run keeps its result file the same way, because its parallel run prints no line for a passing test.
      - name: Keep the Linux test list
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-core-tests
          path: artifacts/test-runs/linux-core/
          if-no-files-found: ignore
          retention-days: 14
      # The machine is gone after the job: keep the per-step logs so a red run names its failing tests.
      - name: Keep the step logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-portable-test-runs
          path: artifacts/test-runs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record what was tested, for the lane runner
        if: success() && (github.event_name == 'pull_request' || inputs.base != '')
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # GitHub's merge commit: parent 1 is the base, parent 2 the PR's head. The runner matches the tree.
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          # A PR's quick tier is not the whole plan, so it must not be read as one.
          if [ "$EVENT" = pull_request ]; then
            echo "::notice title=lane-hosted-tested::plan=fast-portable-pr-quick tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
          else
            echo "::notice title=lane-hosted-tested::plan=fast-portable tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
          fi
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "hosted-portable took ${seconds}s on ubuntu-latest." | tee -a "$GITHUB_STEP_SUMMARY"

  scope:
    # #2596: one cheap Linux job decides whether the Mac jobs below have anything to test. Runs the base branch's copy
    # of test-scope.py, the one lane-runner.py's hosted_check_set reads, with no credentials and no write token; its
    # only output is `mac`. #3501: with the PR's copy the two could disagree (a PR changing the rule, or a branch older
    # than a change to it), and the runner then required a check this job kept skipping.
    name: 'hosted fast: scope'
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.scope.outputs.mac }}
      reason: ${{ steps.scope.outputs.reason }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      app: ${{ steps.scope.outputs.app }}
      app_reason: ${{ steps.scope.outputs.app_reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Do the Mac checks have anything to test?
        id: scope
        env:
          BASE: ${{ inputs.base }}
          QUEUE_TRUNK: ${{ github.event.merge_group.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          # A merge group: everything the group adds to the trunk itself (refs/heads/main, fetched here), not only the
          # last PR's diff, so a group whose head entry is docs-only still runs the Mac checks for a Swift PR ahead of
          # it (the queue merges the whole group on the head's result). Not merge_group.base_sha: that is the commit
          # the entry was built on, which for any entry behind another is the previous entry's queue commit, not
          # main's tip, so its diff held only the last PR (#5179, 2026-11-23). The rule is read from that same trunk
          # commit. A PR: the merge commit's parent 1 is the base, parent 2 the PR's
          # head (the changed-files rule of the Mac rest job). A dispatch with a base: the dispatched commit against
          # that base's tip. A dispatch without a base has no diff to look at, so the Mac checks run.
          list="$RUNNER_TEMP/changed-files.txt"
          rule="$RUNNER_TEMP/test-scope.py"
          if [ "$EVENT" = merge_group ]; then
            trunk="${QUEUE_TRUNK#refs/heads/}"
            trunk="refs/remotes/origin/${trunk:-main}"
            git fetch --no-tags origin "+refs/heads/${trunk#refs/remotes/origin/}:$trunk" &&
              git diff --name-only --no-renames "$(git merge-base HEAD "$trunk")" HEAD > "$list" || rm -f "$list"
            git show "$trunk:scripts/test-scope.py" > "$rule" 2> /dev/null || rm -f "$rule"
          # Not a dispatch: a dispatch on the trunk checks out its tip, a merge commit whose HEAD^2 is the last merged PR,
          # and that PR's files are not a diff to test (a seeding dispatch must run every step, #4664).
          elif [ "$EVENT" != workflow_dispatch ] && git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            git diff --name-only --no-renames "$(git merge-base HEAD^1 HEAD^2)" HEAD^2 > "$list" || rm -f "$list"
            git show HEAD^1:scripts/test-scope.py > "$rule" 2> /dev/null || rm -f "$rule"
          elif [ -n "$BASE" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" &&
              git diff --name-only --no-renames "$(git merge-base HEAD "refs/remotes/origin/$BASE")" HEAD > "$list" || rm -f "$list"
            git show "refs/remotes/origin/$BASE:scripts/test-scope.py" > "$rule" 2> /dev/null || rm -f "$rule"
          fi
          if [ -s "$list" ] && [ -s "$rule" ]; then
            python3 "$rule" --mac-required "$list" | tee -a "$GITHUB_OUTPUT" || echo "mac=true" >> "$GITHUB_OUTPUT"
          else
            { echo "mac=true"; echo "reason=no changed-file list or base rule, so the Mac checks run"; } | tee -a "$GITHUB_OUTPUT"
          fi
          grep -q '^mac=' "$GITHUB_OUTPUT" || echo "mac=true" >> "$GITHUB_OUTPUT"
          # The merge queue's app compile (app-compile below). A base rule without --app-compile-required prints only a
          # usage error, so no app= line: the grep after this writes app=true. Unsure builds.
          if [ -s "$list" ] && [ -s "$rule" ]; then
            python3 "$rule" --app-compile-required "$list" | tee -a "$GITHUB_OUTPUT" || true
          else
            echo "app=true" | tee -a "$GITHUB_OUTPUT"
          fi
          grep -q '^app=' "$GITHUB_OUTPUT" || echo "app=true" >> "$GITHUB_OUTPUT"
          # Docs-only: every changed path is one the old paths-ignore list skipped. No list says false. The Site/
          # folders that hold code with tests are not docs (Site/quiz/, #5048): a change there runs the portable plan,
          # whose runner tests in the merge group include test_quiz_page.
          if [ -s "$list" ] && python3 -c '
          import sys
          docs = ("docs/", "research/", "Design/", "references/", "Site/", "Contracts/docs/")
          code = ("Site/quiz/",)
          paths = [p.strip() for p in open(sys.argv[1]) if p.strip()]
          sys.exit(0 if paths and all(p.endswith(".md") or (p.startswith(docs) and not p.startswith(code)) for p in paths) else 1)
          ' "$list"; then
            echo "docs_only=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" | tee -a "$GITHUB_OUTPUT"
          fi

  sessionkit:
    name: 'hosted fast: SessionKit core'
    needs: scope
    # Not with LANE_HOSTED_MAC_REST `on`: the mac-rest job below runs these tests then (#2596).
    if: >-
      !cancelled() && needs.scope.result != 'skipped' && needs.scope.outputs.mac != 'false' && vars.LANE_HOSTED_MAC_REST != 'on' && (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on'))
    # The image and Xcode the lane Mac builds with (hosted-app-macos.yml says why), so the two can't disagree.
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      # The Mac-wide host-test slots (lane_slots.py) live in the state folder: this machine is the job's alone.
      - name: Start the clock
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "SM_LANE_STATE_DIR=$RUNNER_TEMP/lane-state" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # A dispatch with a base merges it in below, which needs the history back to the merge base.
          fetch-depth: ${{ inputs.base == '' && 1 || 0 }}
      - name: Merge the base in (dispatch with a base)
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          # As GitHub's merge commit: the base's tip is parent 1, the dispatched commit parent 2. A conflict fails.
          head=$(git rev-parse HEAD)
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git checkout --quiet --detach "refs/remotes/origin/$BASE"
          git -c user.name=lane -c user.email=lane@users.noreply.github.com merge --quiet --no-ff --no-edit "$head"
          git log --oneline -1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The package's build folder: dependency checkouts (onnxruntime's binary framework is the big one) and their
      # products. Our own sources are always newer than the restored objects, so only the dependencies are reused.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Packages/SessionKit/.build
          key: sessionkit-macos-xcode27.0-${{ hashFiles('Packages/SessionKit/Package.swift', 'Packages/SessionKit/Package.resolved') }}
          restore-keys: sessionkit-macos-xcode27.0-
      # The test inventory check at startup loads the contract validator, which needs jsonschema (#1389).
      - name: Python tools
        run: bash scripts/bootstrap-python-tools.sh
      - name: SessionKit build and SessionKitCoreTests
        run: |
          swift --version
          .venv/bin/python scripts/verify-tests.py --plan fast-hosted-sessionkit --leave-out-slow
      - name: Keep the step logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-sessionkit-test-runs
          path: artifacts/test-runs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record what was tested, for the lane runner
        if: success() && (github.event_name == 'pull_request' || inputs.base != '')
        run: |
          # GitHub's merge commit: parent 1 is the base, parent 2 the PR's head. The runner matches the tree.
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          echo "::notice title=lane-hosted-tested::plan=fast-hosted-sessionkit tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "hosted fast SessionKit core took ${seconds}s on xcode-27." | tee -a "$GITHUB_STEP_SUMMARY"

  app-compile:
    # 2026-11-20: no required check compiled the app, so #4602's Swift error in FollowListsScreen.swift passed every gate
    # and main did not compile for about 2.5 hours (#4750). This builds the app for the simulator, with no tests and no
    # simulator, in each merge group whose diff reaches an app build input (test-scope.py app_compile_required). On a PR
    # it is skipped, which reports success, so the required check passes on the PR and is earned in the queue: one Mac
    # build per merge group, never per push. The per-PR app builds of 2026-11-18 (retired) queued for 1 to 2.5 hours;
    # the queue builds at most 3 groups at once, so this holds at most 3 Macs. main-t3.yml still runs the app tests.
    # Cost and catch: about 8 minutes of hosted Mac per merge group that touches the app (hosted-app-macos.yml on main
    # took 6 to 8 minutes, 2026-11-20). It would have caught #4602. Waste signal: a month in which it never fails.
    name: 'hosted app: build (no tests)'
    needs: scope
    if: >-
      !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.app != 'false' &&
      (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      DERIVED: ${{ github.workspace }}/.build/hosted-dd
      CAS: ${{ github.workspace }}/.build/compilation-cache
      CAS_PACK: ${{ github.workspace }}/.build/compilation-cache-pack
      SPM: ${{ github.workspace }}/.build/spm
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The app bundles the voice models (LFS). The same cache hosted-app-macos.yml keeps on main.
      - name: List LFS objects
        run: mkdir -p .build && git lfs ls-files --long | cut -d' ' -f1 | sort > .build/lfs-ids.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.build/lfs-ids.txt') }}
          restore-keys: lfs-
      - name: Fetch LFS files
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull
      # Restore only: main's hosted-app-macos.yml runs save these, and a merge group's run can read main's caches.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SPM }}
          key: spm-${{ hashFiles('SpokenMarginsNative.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/SessionKit/Package.resolved') }}
          restore-keys: spm-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ${{ env.CAS_PACK }}
          key: xcode-cas-sparse-27.0-${{ github.run_id }}
          restore-keys: xcode-cas-sparse-27.0-
      - name: Unpack the compilation cache
        run: CAS="$CAS" PACK="$CAS_PACK" bash scripts/ci-cas-cache.sh unpack
      - name: Build the app for the simulator (build-for-testing, no tests)
        env:
          WHY: ${{ needs.scope.outputs.app_reason }}
        run: |
          echo "Why: ${WHY:-no reason given}"
          mkdir -p "$RUNNER_TEMP/results"
          root="$GITHUB_WORKSPACE"
          set -o pipefail
          xcodebuild -project SpokenMarginsNative.xcodeproj -scheme SpokenMarginsAppBehavior -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$SPM" \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$CAS" COMPILATION_CACHE_LIMIT_SIZE=1G \
            SWIFT_ENABLE_PREFIX_MAPPING=YES SWIFT_ENABLE_PROJECT_PREFIX_MAPPING=YES \
            CLANG_ENABLE_PREFIX_MAPPING=YES CLANG_ENABLE_PROJECT_PREFIX_MAPPING=YES \
            SWIFT_OTHER_PREFIX_MAPPINGS="\"$root=/^tree\"" CLANG_OTHER_PREFIX_MAPPINGS="\"$root=/^tree\"" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/results/build-for-testing.log" | grep -E 'error:|BUILD|cacheable tasks' || true
          grep -q 'TEST BUILD SUCCEEDED' "$RUNNER_TEMP/results/build-for-testing.log"
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-compile-log
          path: ${{ runner.temp }}/results/build-for-testing.log
          retention-days: 14
      - name: How long it took
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "hosted app compile took ${seconds}s." | tee -a "$GITHUB_STEP_SUMMARY"

  mac-rest:
    # #2459: --plan fast-mac-rest, which the lane's automerge job used to run on the owner's build Mac (about 8 minutes
    # a PR, behind a queue of up to 21 jobs on 2026-10-22). Same PRs and paths as the two jobs above, once
    # LANE_HOSTED_MAC_REST is `on` too; lane.yml then routes the automerge job to hosted Linux.
    # Not yet on (2026-10-22): on this image (macOS 27; run 39831658469) 996 of 998 tests passed, but two depend on the
    # OS: SystemNarrationRateTests heard Samantha at 0.5x as 0.63x (its rate table was measured on macOS 26, the lane
    # Mac's), and RealSpeechTranscriberTests skipped, with no en_US SpeechTranscriber model. macos-26 matches the lane
    # Mac's OS but has no Xcode 27, and Xcode 26.6 does not compile SessionKit's tests (run 39836269608). #2469 tracks it.
    name: 'hosted fast: Mac rest'
    needs: scope
    # Merge queue (#4693): with the repository variable MERGE_QUEUE_MAC set to `queue-only`, this job runs in the
    # merge queue and on a dispatch, never on a PR push. On a PR it is then skipped, which reports success, so the
    # one required check name passes on the PR and is earned in the queue: one Mac run per merge instead of one per
    # push. For an early Mac run on a PR, dispatch this workflow on its branch (`gh workflow run hosted-portable.yml
    # --ref <branch>`). Unset (today), PRs run it as before, because the lane still merges on it. The variable goes
    # on in the same hour the ruleset starts requiring the queue.
    if: >-
      !cancelled() && needs.scope.result != 'skipped' && needs.scope.outputs.mac != 'false' && (github.event_name != 'pull_request' ||
      ((github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on') &&
       vars.MERGE_QUEUE_MAC != 'queue-only' && vars.LANE_HOSTED_MAC_REST == 'on'))
    runs-on: xcode-27
    # SessionKit's build (cached dependencies) and SessionKitCoreTests (the `sessionkit` job's 40 minutes before they
    # moved here, #2596), its two serial targets, and the compatibility checks when the diff reaches them (the lane's
    # own budget for those is 40 minutes).
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Start the clock
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "SM_LANE_STATE_DIR=$RUNNER_TEMP/lane-state" >> "$GITHUB_ENV"
      # Whole history and tags: the compatibility checks read the shipped build's tag, and the changed-file list
      # below needs the merge base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Merge the base in (dispatch with a base)
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          # As GitHub's merge commit: the base's tip is parent 1, the dispatched commit parent 2. A conflict fails.
          head=$(git rev-parse HEAD)
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git checkout --quiet --detach "refs/remotes/origin/$BASE"
          git -c user.name=lane -c user.email=lane@users.noreply.github.com merge --quiet --no-ff --no-edit "$head"
          git log --oneline -1
      # The voice models are LFS files the SessionKit voice tests read. The same cache hosted-app-macos.yml keeps on
      # the trunk, so a PR's run restores it instead of spending the LFS bandwidth quota.
      - name: List LFS objects
        run: mkdir -p .build && git lfs ls-files --long | cut -d' ' -f1 | sort > .build/lfs-ids.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.build/lfs-ids.txt') }}
          restore-keys: lfs-
      - name: Fetch LFS files
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # This job's own key (#4664). Its `tools` step builds Packages/SessionKitTools into .build/tools, which fetches the
      # onnxruntime binary targets again from download.onnxruntime.ai (an invalid certificate there failed this job's
      # `tools` step on 2026-11-21, after `package` had passed from the cache). The `sessionkit` job above shares the
      # plain key and never runs `tools`, so whichever of the two saved first decided that .build/tools was never
      # cached. Keyed apart, and on the tools package's own files too, this job saves a .build that holds it. The
      # fallback to the shared prefix keeps the first run warm; a cache is saved only by a run that passed.
      # A run reads only its own ref's caches and the default branch's, and a merge group's ref is new every time, so
      # the entry that serves the queue is the one saved from main: dispatch this workflow on main after the key
      # changes (shipped-build-compat.yml restores the same entry).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Packages/SessionKit/.build
          key: sessionkit-mac-rest-xcode27.0-${{ hashFiles('Packages/SessionKit/Package.swift', 'Packages/SessionKit/Package.resolved', 'Packages/SessionKitTools/Package.swift', 'Packages/SessionKitTools/Package.resolved') }}
          restore-keys: |
            sessionkit-mac-rest-xcode27.0-
            sessionkit-macos-xcode27.0-
      - name: Python tools
        run: bash scripts/bootstrap-python-tools.sh
      # Before BlackHole, as the `sessionkit` job ran them (#2596). The second plan's build is then incremental.
      - name: SessionKit build and SessionKitCoreTests
        run: |
          swift --version
          .venv/bin/python scripts/verify-tests.py --plan fast-hosted-sessionkit --leave-out-slow
      - name: Keep the Mac test list
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-core-tests
          path: artifacts/test-runs/*/package-core.xunit.xml
          if-no-files-found: ignore
          retention-days: 14
      # Hosted Macs have no audio hardware, and AVPlayer's clock does not move without a running output (#909).
      # BlackHole gives Core Audio one. brew refuses to run as root; the cask's installer asks for sudo itself,
      # which is passwordless on hosted runners. verify-tests.py checks the output starts before the audio tests.
      - name: Install BlackHole (virtual audio output)
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          # Core Audio picks up a new driver only after it restarts.
          sudo killall coreaudiod || true
          sleep 5
          SwitchAudioSource -t output -s "BlackHole 2ch"
          SwitchAudioSource -t output -c | sed 's/^/Default output: /' | tee -a "$GITHUB_STEP_SUMMARY"
      # What the lane's own run gets (lane-runner.py changed_paths_for_tests): every path the PR changes against its
      # merge base with the base, both sides of a rename. A dispatch without a base runs every step.
      - name: Changed files
        env:
          QUEUE_TRUNK: ${{ github.event.merge_group.base_ref }}
          EVENT: ${{ github.event_name }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          # A merge group: everything the group adds to the trunk itself, as in the `scope` job (not base_sha, the
          # previous queue entry's commit, #5179).
          if [ "$EVENT" = merge_group ]; then
            trunk="${QUEUE_TRUNK#refs/heads/}"
            trunk="refs/remotes/origin/${trunk:-main}"
            git fetch --no-tags origin "+refs/heads/${trunk#refs/remotes/origin/}:$trunk"
            git diff --name-only --no-renames "$(git merge-base HEAD "$trunk")" HEAD > "$RUNNER_TEMP/changed-files.txt"
            echo "CHANGED_ARGS=--changed-files $RUNNER_TEMP/changed-files.txt" >> "$GITHUB_ENV"
            echo "$(grep -c . "$RUNNER_TEMP/changed-files.txt" || true) changed files in the merge group"
          # A dispatch with no base is not a merge to read a diff from: on the trunk it checks out the tip, a merge commit
          # whose HEAD^2 is the last merged PR, and that PR's files would skip `tools` in the run that seeds the cache
          # (#4664). With a base, the step above merged it in, so HEAD^2 is the dispatched commit.
          elif { [ "$EVENT" != workflow_dispatch ] || [ -n "$DISPATCH_BASE" ]; } && git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            git diff --name-only --no-renames "$(git merge-base HEAD^1 HEAD^2)" HEAD^2 > "$RUNNER_TEMP/changed-files.txt"
            echo "CHANGED_ARGS=--changed-files $RUNNER_TEMP/changed-files.txt" >> "$GITHUB_ENV"
            echo "$(grep -c . "$RUNNER_TEMP/changed-files.txt" || true) changed files"
          else
            echo "Not a merge commit: every fast-mac-rest step runs."
          fi
      - name: Mac rest of the fast plan
        run: |
          swift --version
          .venv/bin/python scripts/verify-tests.py --plan fast-mac-rest $CHANGED_ARGS --leave-out-slow
      - name: Keep the step logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-mac-rest-test-runs
          path: artifacts/test-runs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record what was tested, for the lane runner
        if: success() && (github.event_name == 'pull_request' || inputs.base != '')
        run: |
          # GitHub's merge commit: parent 1 is the base, parent 2 the PR's head. The runner matches the tree.
          # Both plans in the name: an older job's plan=fast-mac-rest ran no core tests and must not stand for them.
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          echo "::notice title=lane-hosted-tested::plan=fast-hosted-sessionkit+fast-mac-rest tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "hosted fast Mac rest took ${seconds}s on xcode-27." | tee -a "$GITHUB_STEP_SUMMARY"

  stop-macs-on-red:
    # #2596: the org's hosted-Mac pool is five jobs wide. In the 24 h to 2026-10-24, 22 Mac jobs of this workflow kept
    # running (or sat queued) for 398 Mac-minutes after the Linux job of the same run had failed, and the author's
    # next push cancelled them: 9% of the day's Mac minutes, which were other PRs' queue wait. When `portable` ends
    # red this job cancels the run. The failed check keeps its `failure` conclusion, which is what the lane runner
    # reads (hosted_fast_records); the Mac checks end `cancelled`. No PR code runs here: the only step is `gh run
    # cancel`, with a token that may write to Actions and nothing else.
    name: stop-macs-on-red
    needs: portable
    if: always() && needs.portable.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Cancel the Mac jobs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: gh run cancel "$RUN" || true

  linux-retry-tally:
    # #3529: a SessionKitCoreTests test that fails on Linux and passes on its rerun counts as a pass (owner,
    # 2026-10-24), and each such retry-pass is tallied on #2176, so three in 7 days open its own `Flaky:` issue. The
    # portable job's token is read-only, so it hands the names over as its `retried` output and this job posts them.
    # Only when there is one: on every other run it is skipped. scripts/linux_core_tally.py comes from the PR's base
    # (main on a dispatch) with no credentials kept, never from the PR; the names arrive through env, and the script
    # keeps only SessionKitCoreTests names. Its token may write issues and nothing else.
    # Cost and catch: one free Linux minute on a run with a retry-pass, none otherwise. It catches a Linux flake hidden
    # behind the rerun, which no tally saw before this job. Waste signal: no Linux tally on #2176 in three months.
    name: linux-retry-tally
    needs: portable
    if: always() && needs.portable.result == 'success' && needs.portable.outputs.retried != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
          sparse-checkout: |
            scripts/linux_core_tally.py
            scripts/flake_tally.py
            scripts/flake_tally_report.py
            scripts/comment_trust.py
          sparse-checkout-cone-mode: false
      - name: Tally the Linux retry-passes on #2176
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RETRIED: ${{ needs.portable.outputs.retried }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ ! -f scripts/linux_core_tally.py ]; then
            echo "The base has no scripts/linux_core_tally.py yet; nothing to tally. Retried: $RETRIED"
            exit 0
          fi
          python3 scripts/linux_core_tally.py

  owner-tap-alert:
    # When the jobs above finish, tell the owner's phone if this PR now waits only for his merge tap (#2047, #2442):
    # scripts/owner_tap_alert.py posts one github-actions[bot] comment that @mentions him, once per head, when the
    # PR touches .github/ or scripts/lane-runner.py and is ready. It moved here from linux-t1.yml (retired, #2442),
    # whose one VPS runner held it in a queue for an hour or more. With LANE_HOSTED_FAST off the two jobs above are
    # skipped and this runs at once; another workflow's alert job or the owner-tap-check label then decides. It runs
    # on its own GitHub-hosted machine, apart from the jobs that run PR code. The script comes from the PR's base with
    # no credentials kept, never from the PR; it and linux-retry-tally are the only jobs here whose token may comment. A
    # base that doesn't have the script yet skips quietly. Pull requests from this repository only. It waits for
    # linux-retry-tally too, so that job is never an unfinished head check while the alert reads them.
    name: owner-tap-alert
    needs: [portable, scope, sessionkit, mac-rest, linux-retry-tally]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/owner_tap_alert.py
            scripts/comment_trust.py
            scripts/trunk.py
          sparse-checkout-cone-mode: false
      - name: Alert the owner if this PR is ready for his merge tap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f scripts/owner_tap_alert.py ]; then
            echo "The base has no scripts/owner_tap_alert.py yet; nothing to check."
            exit 0
          fi
          python3 scripts/owner_tap_alert.py --pr "$PR"

  rearm:
    # Start the merge run of each armed PR on this head again, now that this workflow run is over (lane-runner.py
    # WAITING, scripts/lane_rearm.py). It is a job here, not a workflow_run workflow, because GitHub starts no
    # workflow_run for a run that GITHUB_TOKEN caused, and the lane's own dispatches of this workflow are such runs:
    # their PRs would never have been started again. A dispatch sent with GITHUB_TOKEN does start lane.yml. It waits for
    # every other job, so the PR's last check has recorded before the merge run reads it. `always()` also runs it after
    # a failure or a cancel, so the PR gets its report (a PASS, or a FAIL it can be fixed from). The script comes from the PR's base
    # (the trunk, or the lane-check/** base under test), never the PR's head, and the head reaches the shell only through env. Same-repo runs only. Its outcome is read from the
    # check jobs only: owner-tap-alert and linux-retry-tally run `always()` and end `success` even when every check skipped.
    name: rearm
    needs: [portable, scope, sessionkit, mac-rest, app-compile, stop-macs-on-red, linux-retry-tally, owner-tap-alert]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write  # dispatching lane.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref || inputs.base || vars.SM_TRUNK || 'main' }}
          persist-credentials: false
          sparse-checkout: scripts/lane_rearm.py
          sparse-checkout-cone-mode: false
      - name: Start the merge run of each armed PR on this head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULTS: ${{ needs.portable.result }} ${{ needs.scope.result }} ${{ needs.sessionkit.result }} ${{ needs.mac-rest.result }}
        run: |
          if [ ! -f scripts/lane_rearm.py ]; then
            echo "::notice::scripts/lane_rearm.py is not on the trunk; nothing started."
            exit 0
          fi
          python3 scripts/lane_rearm.py --head "$HEAD_SHA" --results "$RESULTS"
