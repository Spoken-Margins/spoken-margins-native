# Hosted portable checks (#1847, #1389): the fast plan's Python and Node steps on a GitHub-hosted ubuntu runner,
# so the Mac doesn't spend a slot on them. `scripts/verify-tests.py --plan fast-portable` runs the runner tests
# (without the ones that drive Apple tools), the ops tests (without ops/disk), the contract and surface
# validators, the test inventory, the browser-extraction and share-link suites, and the research suites. It
# prints each step it leaves out and a host test fails if a fast-plan step is in neither list.
# The second job, `sessionkit`, runs `--plan fast-hosted-sessionkit` on a GitHub-hosted Mac: SessionKit's build and
# SessionKitCoreTests. SessionKitTests and SessionKitTraceTests need a sound output and stay on the lane Mac.
#
# Per PR, only once the lane takes hosted results (#1389): the pull_request trigger is here, but both jobs are
# skipped, and cost nothing, until the repository variable LANE_HOSTED_FAST is `on`. The private repo's free
# minutes ran out on 2026-10-07 (#1023); once the repo is public, standard hosted runners are free and the lead
# sets the variable (`gh variable set LANE_HOSTED_FAST --body on`). The same variable tells the lane runner
# (lane.yml) to accept these two PASSes on the merge commit it would push and run only `--plan fast-mac-rest` on
# the Mac. Unset or anything else, the lane runs the whole --plan fast on the Mac as before.
# On a PASS each job records what it tested as a notice annotation (`lane-hosted-tested`): the merge commit's tree
# and its two parents (the base, then the PR's head). The runner reads it from the check run and matches the tree
# against its own merge (lane-runner.py hosted_fast_checks).
#
# Dispatch it by hand on any branch with `gh workflow run hosted-portable.yml --ref <branch>`.
#
# No secrets, a read-only token, no pull_request_target, no Git LFS (the voice models stay pointers; the
# contracts step checks each pointer's recorded size and hash against the manifest; SessionKit reads no LFS file).
name: hosted-portable

on:
  workflow_dispatch:
  pull_request:
    branches: [next, main]  # either trunk (#1492); the checks read the PR's own base
    # Docs-only PRs are T0 (scripts/test-scope.py): the lane runs nothing for them and never waits for these checks.
    paths-ignore: ['**/*.md', 'docs/**', 'research/**', 'Design/**', 'references/**', 'Site/**', 'Contracts/docs/**']

permissions:
  contents: read

concurrency:
  group: hosted-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    # Same-repo PRs only: a fork's PR would run its own code (here on a GitHub machine with no secrets, but the
    # same guard as every other job keeps the rule in one place). Always true for workflow_dispatch.
    # And, for a PR, only once the lane takes hosted results (LANE_HOSTED_FAST, above).
    name: 'hosted fast: portable'
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # A shallow checkout without LFS: nothing here needs the app's voice models.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # pip's and npm's download caches, keyed on the lock files (#1389).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # research/B4/server's tests; its go.mod names the version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: research/B4/server/go.mod
      - name: Python tools and Node packages
        run: |
          bash scripts/bootstrap-python-tools.sh
          npm ci
      - name: Portable fast plan
        run: .venv/bin/python scripts/verify-tests.py --plan fast-portable
      # The machine is gone after the job: keep the per-step logs so a red run names its failing tests.
      - name: Keep the step logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-portable-test-runs
          path: artifacts/test-runs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record what was tested, for the lane runner
        if: success() && github.event_name == 'pull_request'
        run: |
          # GitHub's merge commit: parent 1 is the base, parent 2 the PR's head. The runner matches the tree.
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          echo "::notice title=lane-hosted-tested::plan=fast-portable tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "hosted-portable took ${seconds}s on ubuntu-latest." | tee -a "$GITHUB_STEP_SUMMARY"

  sessionkit:
    name: 'hosted fast: SessionKit core'
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && vars.LANE_HOSTED_FAST == 'on')
    # The image and Xcode the lane Mac builds with (hosted-app-macos.yml says why), so the two can't disagree.
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      # The Mac-wide host-test slots (lane_slots.py) live in the state folder: this machine is the job's alone.
      - name: Start the clock
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "SM_LANE_STATE_DIR=$RUNNER_TEMP/lane-state" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The package's build folder: dependency checkouts (onnxruntime's binary framework is the big one) and their
      # products. Our own sources are always newer than the restored objects, so only the dependencies are reused.
      - uses: actions/cache@v4
        with:
          path: Packages/SessionKit/.build
          key: sessionkit-macos-xcode27.0-${{ hashFiles('Packages/SessionKit/Package.swift', 'Packages/SessionKit/Package.resolved') }}
          restore-keys: sessionkit-macos-xcode27.0-
      # The test inventory check at startup loads the contract validator, which needs jsonschema (#1389).
      - name: Python tools
        run: bash scripts/bootstrap-python-tools.sh
      - name: SessionKit build and SessionKitCoreTests
        run: |
          swift --version
          .venv/bin/python scripts/verify-tests.py --plan fast-hosted-sessionkit
      - name: Keep the step logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-sessionkit-test-runs
          path: artifacts/test-runs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record what was tested, for the lane runner
        if: success() && github.event_name == 'pull_request'
        run: |
          # GitHub's merge commit: parent 1 is the base, parent 2 the PR's head. The runner matches the tree.
          parents=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | tr '\n' ' ')
          echo "::notice title=lane-hosted-tested::plan=fast-hosted-sessionkit tree=$(git rev-parse 'HEAD^{tree}') parents=$parents"
      - name: Report time
        if: always()
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "hosted fast SessionKit core took ${seconds}s on xcode-27." | tee -a "$GITHUB_STEP_SUMMARY"

  owner-tap-alert:
    # When both jobs above finish, tell the owner's phone if this PR now waits only for his merge tap (#2047, #2442):
    # scripts/owner_tap_alert.py posts one github-actions[bot] comment that @mentions him, once per head, when the
    # PR touches .github/ or scripts/lane-runner.py and is ready. It moved here from linux-t1.yml (retired, #2442),
    # whose one VPS runner held it in a queue for an hour or more. With LANE_HOSTED_FAST off the two jobs above are
    # skipped and this runs at once; another workflow's alert job or the owner-tap-check label then decides. It runs
    # on its own GitHub-hosted machine, apart from the jobs that run PR code. The script comes from the PR's base with
    # no credentials kept, never from the PR, and this is the only job here whose token may comment. A base that
    # doesn't have the script yet skips quietly. Pull requests from this repository only.
    name: owner-tap-alert
    needs: [portable, sessionkit]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/owner_tap_alert.py
            scripts/comment_trust.py
            scripts/trunk.py
          sparse-checkout-cone-mode: false
      - name: Alert the owner if this PR is ready for his merge tap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f scripts/owner_tap_alert.py ]; then
            echo "The base has no scripts/owner_tap_alert.py yet; nothing to check."
            exit 0
          fi
          python3 scripts/owner_tap_alert.py --pr "$PR"
