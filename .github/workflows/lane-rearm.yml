# Start an armed PR's merge run again when its hosted checks finish (2026-11-19).
#
# The hosted automerge and release jobs no longer sleep on a hosted Linux runner for up to two hours while
# hosted-portable.yml runs: each held one of the org's 20 concurrent hosted slots (8 of 15 running Linux jobs, with 84
# Linux and 22 Mac jobs queued). After about 8 minutes with a check still running the job reports nothing and exits
# (lane-runner.py, WAITING). This workflow is what runs the PR again: when hosted-portable.yml or hosted-web.yml
# completes, scripts/lane_rearm.py dispatches lane.yml on the trunk with the PR, its head and auto=true for every open
# same-repo PR on that commit that still carries automerge, exactly as the audit does (#2170). The `release` job
# re-reads the PR and the checks, merges on green and reports a failure on red.
#
# workflow_run always runs the default branch's copy of this file, and the script comes from the trunk's tip, never a
# PR. The head SHA is read as data; fork runs are skipped. It runs a few seconds on a hosted Linux runner.
name: lane-rearm

on:
  workflow_run:
    workflows: [hosted-portable, hosted-web]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: write  # dispatching lane.yml

jobs:
  rearm:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ vars.SM_TRUNK || 'main' }}
          persist-credentials: false
          sparse-checkout: scripts/lane_rearm.py
          sparse-checkout-cone-mode: false
      - name: Start the merge run of each armed PR on this head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ ! -f scripts/lane_rearm.py ]; then
            echo "::notice::scripts/lane_rearm.py is not on the trunk; nothing started."
            exit 0
          fi
          python3 scripts/lane_rearm.py --head "$HEAD_SHA" --conclusion "$CONCLUSION"
