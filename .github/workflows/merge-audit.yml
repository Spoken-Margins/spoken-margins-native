# Flags merges into next that didn't go through the triage desk's merge check. See
# scripts/merge_audit.py for the rule, and "The lead session" in docs/workstreams/kickoff.md.
#
# Trigger: every push to next, rather than pull_request `closed`. A pull_request run is built from
# the PR's merge ref, which GitHub doesn't always refresh when next moves (#221 on #184), so an audit
# could silently not run for exactly the merges it should catch. A push run always uses next's own
# copy of this file, and it also sees a commit pushed to next without any pull request.
#
# It runs on a GitHub-hosted Linux runner (free for the public repo; on the owner's VPS until #2442), so it
# never queues behind lane jobs on the Mac. It never reverts anything: it labels and comments.
# Fork-safe as it is (#1719): only people with write access can push to next, so no fork code runs
# with its token. Don't add a pull_request trigger here without the same-repo guard lane.yml uses.
#
# The lane runner's own merges: it merges with the workflow token (decision 3), and pushes made with
# that token start no workflow, so this file never sees them. lane-runner.py runs
# `merge_audit.py --sweep-hours 2` itself after each merge it pushes. There is no schedule here:
# GitHub runs scheduled workflows only from the default branch (main), whose copy lags next's.
name: merge-audit

on:
  push:
    # Both trunks (#1492); the job runs only for the one SM_TRUNK names.
    branches: [next, main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit:
    if: github.ref_name == (vars.SM_TRUNK || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/merge_audit.py
            scripts/trunk.py
          sparse-checkout-cone-mode: false
      - name: Audit the merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_REF: ${{ github.ref_name }}
        run: python3 scripts/merge_audit.py --before "$BEFORE" --after "$AFTER" --base "$BASE_REF"
