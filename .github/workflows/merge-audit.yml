# Flags merges into next that didn't go through the triage desk's merge check. See
# scripts/merge_audit.py for the rule, and "The lead session" in docs/workstreams/kickoff.md.
#
# Trigger: every push to next, rather than pull_request `closed`. A pull_request run is built from
# the PR's merge ref, which GitHub doesn't always refresh when next moves (#221 on #184), so an audit
# could silently not run for exactly the merges it should catch. A push run always uses next's own
# copy of this file, and it also sees a commit pushed to next without any pull request.
#
# It runs on the owner's VPS runner (sm-vps), so it never queues behind lane jobs on the Mac and
# uses none of the free GitHub-hosted Linux minutes. It never reverts anything: it labels and comments.
#
# Hourly sweep: the lane runner merges with the workflow token (decision 3), and pushes made with
# that token start no workflow, so a scheduled run audits every PR merged in the last two hours.
# The overlap is deliberate; flagging is idempotent (an already-labelled PR is left alone).
name: merge-audit

on:
  push:
    branches: [next]
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, sm-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/merge_audit.py
          sparse-checkout-cone-mode: false
      - name: Audit the merge
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: python3 scripts/merge_audit.py --before "$BEFORE" --after "$AFTER"
      - name: Sweep merges made without a push run
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/merge_audit.py --sweep-hours 2
