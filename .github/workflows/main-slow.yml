# The slow tier on main (#5145). Owner decision 2026-11-23: tests that are slow on CI and have not failed in 30 days
# (scripts/slow_tier.py) leave every PR and merge group (hosted-portable.yml passes --leave-out-slow) and run here,
# once a night and before the owner's phone builds, only when main's head has no `main-slow` commit status yet. The
# result is a `main-slow` status on that SHA; scripts/phone-build runs the same tests itself on a commit without a
# green one. A failure opens or updates one "Main slow tests failed on <sha7>" regression issue that names the failing
# tests, the last green `main-slow` and every merge since it. scripts/main_slow.py has the rules.
#
# Cost and catch: one GitHub-hosted Mac run of about 10 minutes (setup, SessionKit build from the shared cache, then
# about 5 minutes of tests), at most 3 a day and none on a day main does not move. It replaces about 5 minutes of
# hosted-Mac test time in every Swift merge group and about 2 minutes of Linux time in every merge group. It catches a
# break in a moved test within a day, with the merges to look at. Waste signal: a red `main-slow` means a moved test
# still catches things, so it goes back to every PR (delete its line in scripts/slow_tier.py); a slow tier with no
# test left in it means this workflow can go.
#
# workflow_dispatch: `force` runs even when the SHA already has a status; `sha` tests an older commit on main.
name: main-slow

on:
  schedule:
    # Nightly, at a jittered minute (GitHub delays runs scheduled at :00): 00:47 America/Phoenix.
    - cron: '47 7 * * *'
    # Before the phone builds at 8:00 and 17:00 Phoenix (UTC-7), ten minutes after main-t3's ticks so the two Mac
    # runs don't start together. They skip like the nightly when main's head already has a result.
    - cron: '40 13 * * *'
    - cron: '40 22 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'A full commit SHA on main to test (default: main''s head)'
        required: false
        default: ''
      force:
        description: 'Run even if the commit already has a main-slow status'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: main-slow
  cancel-in-progress: false

jobs:
  decide:
    name: 'decide: has main moved since its last main-slow?'
    if: github.ref_name == (vars.SM_TRUNK || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.sha.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SM_TRUNK: ${{ vars.SM_TRUNK || 'main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ vars.SM_TRUNK || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Which commit
        id: sha
        env:
          WANTED: ${{ inputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          sha="${WANTED:-$head}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character commit SHA"; exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "$head"; then
            echo "::error::$sha is not on $SM_TRUNK"; exit 1
          fi
          # The test job runs the commit's own scripts; a commit from before the slow tier has none to run.
          if ! git cat-file -e "$sha:scripts/main_slow.py" 2>/dev/null; then
            echo "::error::$sha is from before the slow tier (#5145): it has no scripts/main_slow.py"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Decide
        id: decide
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python3 scripts/main_slow.py decide --sha "$SHA" $FORCE

  slow:
    name: 'main-slow: the slow tier on main'
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 75
    permissions:
      contents: read
      statuses: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.decide.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.decide.outputs.sha }}
          # Full history: a failure issue lists the merges since the last green main-slow.
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Lane state folder
        run: |
          echo "SM_LANE_STATE_DIR=$RUNNER_TEMP/lane-state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/lane-state"
      - name: Mark the commit pending
        run: python3 scripts/main_slow.py pending --sha "$SHA" --run-url "$RUN_URL"
      # The Kitten tests read the voice models, which are LFS files. The same cache hosted-portable.yml's Mac job reads.
      - name: List LFS objects
        run: mkdir -p .build && git lfs ls-files --long | cut -d' ' -f1 | sort > .build/lfs-ids.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.build/lfs-ids.txt') }}
          restore-keys: lfs-
      - name: Fetch LFS files
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # hosted-portable.yml's Mac job saves this from main; restore only, so a partial build never replaces it.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Packages/SessionKit/.build
          key: sessionkit-mac-rest-xcode27.0-${{ hashFiles('Packages/SessionKit/Package.swift', 'Packages/SessionKit/Package.resolved', 'Packages/SessionKitTools/Package.swift', 'Packages/SessionKitTools/Package.resolved') }}
          restore-keys: |
            sessionkit-mac-rest-xcode27.0-
            sessionkit-macos-xcode27.0-
      - name: Python tools
        env:
          GH_TOKEN: ''
        run: bash scripts/bootstrap-python-tools.sh
      # SessionKitTests runs here as in hosted-portable.yml's Mac job, which gives Core Audio an output first (#909).
      - name: Install BlackHole (virtual audio output)
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          sleep 5
          SwitchAudioSource -t output -s "BlackHole 2ch"
      - name: Run the slow tier
        id: run
        env:
          GH_TOKEN: ''
        run: |
          set +e
          .venv/bin/python scripts/verify-tests.py --plan slow --output "$RUNNER_TEMP/slow-run"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Record the result
        id: report
        if: always() && steps.run.outputs.code != ''
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: python3 scripts/main_slow.py report --sha "$SHA" --run-url "$RUN_URL" --manifest "$RUNNER_TEMP/slow-run/manifest.json" --exit-code "$CODE"
      # A job killed after `pending` (cancel, timeout, a dead step, or a report that could not reach GitHub) records
      # `error`, so the next tick retries. After a report that set its status, the newest status is not `pending` and
      # this changes nothing.
      - name: Record a lost run
        if: (failure() || cancelled()) && steps.report.outcome != 'success'
        run: python3 scripts/main_slow.py lost --sha "$SHA" --run-url "$RUN_URL"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-slow-evidence
          path: ${{ runner.temp }}/slow-run/
          if-no-files-found: ignore
          retention-days: 14
