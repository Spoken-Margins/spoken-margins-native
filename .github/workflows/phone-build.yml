# The rolling phone build on a GitHub-hosted Mac (#2357, part of #1389): the signed Release app for the owner's
# iPhone, built from main exactly as scripts/phone-build builds it on his Mac, so the Mac needn't be awake at
# 8 am. Owner, 2026-10-21, asked "May phone builds sign on GitHub with an App Store Connect API key kept in a
# GitHub environment that only runs from main?": "yes to 1".
#
# Output: an artifact `phone-build-<sha>` holding SpokenMarginsApp.app.zip (ditto, so the signature survives)
# and build.json, kept 7 days. On the Mac, `scripts/phone-build --source hosted` downloads it into
# ~/SpokenMargins-phone and writes the test plan, so the Install Spoken Margins on iPhone shortcut is unchanged.
# Nothing here archives, exports or uploads: TestFlight happens only when the owner says "upload".
#
# Trust: only main is built. Triggers are the schedule (always main) and workflow_dispatch; the signing job runs
# in the `phone-build` environment, whose deployment rule admits main only, and refuses any other ref itself.
# There is no pull_request, pull_request_target, issue_comment or workflow_run trigger, and there must never be:
# that would hand the signing secrets to code nobody reviewed.
#
# Secrets (environment `phone-build`): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (an App Store Connect team API
# key; it creates and updates the development provisioning profiles) and DEV_CERT_P12 (base64) with
# DEV_CERT_PASSWORD (one Apple Development certificate). The certificate is there because a fresh runner with
# only the API key makes a new certificate every run, whose private key dies with the runner; they pile up until
# Apple's certificate cap stops signing. Variable: DEVELOPMENT_TEAM (the team ID, not secret; it is in every
# signed app). It goes into Config/Local.xcconfig, as on the Mac (#1841).
#
# Schedule: 12:00 and 21:30 UTC, i.e. 7:00 and 16:30 Central in summer time (6:00 and 15:30 in winter), so a
# build is ready before the daily plan's 8:00 and 17:00 Central slots (docs/workstreams/daily-phone-plan.md).
# A tip that already has an unexpired hosted build is not built again unless `force` is set.
name: phone-build

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if this commit already has a hosted phone build'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: phone-build
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Phone builds come from main only, not $REF."
            exit 1
          fi
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=phone-build-$SHA" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if [ "$count" != "0" ] && [ "$FORCE" != "true" ]; then
            echo "main's tip ${SHA:0:7} already has a hosted phone build; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    environment: phone-build
    # The Mac's clean Release device build takes about 10 min; the hosted Mac is 2-3.5x slower (#1384).
    timeout-minutes: 90
    env:
      DERIVED: ${{ github.workspace }}/.build/phone-dd
      CAS: ${{ github.workspace }}/.build/compilation-cache
      SPM: ${{ github.workspace }}/.build/spm
      OUT: ${{ github.workspace }}/.build/phone-out
      APP_NAME: SpokenMarginsApp.app
    steps:
      - name: Check the ref and the team
        env:
          TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::main only"; exit 1; }
          [[ "$TEAM" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::Set the DEVELOPMENT_TEAM variable (the 10-character team ID) on the phone-build environment."; exit 1; }
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Kitten's model files are LFS objects the app bundles. Keys carry a phone- prefix so this signing job
      # restores only caches it wrote itself.
      - name: List LFS objects
        run: mkdir -p .build && git lfs ls-files --long | cut -d' ' -f1 | sort > .build/lfs-ids.txt
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: phone-lfs-${{ hashFiles('.build/lfs-ids.txt') }}
          restore-keys: phone-lfs-
      - name: Fetch LFS files
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" lfs pull
      - uses: actions/cache@v4
        with:
          path: ${{ env.SPM }}
          key: phone-spm-${{ hashFiles('SpokenMarginsNative.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/SessionKit/Package.resolved') }}
          restore-keys: phone-spm-
      - uses: actions/cache@v4
        with:
          path: ${{ env.CAS }}
          key: phone-cas-27.0-${{ github.run_id }}
          restore-keys: phone-cas-27.0-

      - name: Signing team
        env:
          TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: printf 'DEVELOPMENT_TEAM = %s\n' "$TEAM" > Config/Local.xcconfig

      # A throwaway keychain in $RUNNER_TEMP holds the one development certificate; the API key file sits beside
      # it. Both go in the last step, whatever happens.
      - name: Install the signing certificate and API key
        env:
          P12: ${{ secrets.DEV_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for name in P12 P12_PASSWORD P8 KEY_ID ISSUER; do
            [ -n "${!name}" ] || { echo "::error::A phone-build environment secret is missing ($name); see #2357."; exit 1; }
          done
          umask 077
          keychain="$RUNNER_TEMP/phone-signing.keychain-db"
          kc_password=$(uuidgen)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dev-cert.p12"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          security import "$RUNNER_TEMP/dev-cert.p12" -k "$keychain" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dev-cert.p12"
          security find-identity -v -p codesigning "$keychain" | sed -E 's/[0-9A-F]{40}/<hash>/'

      - name: Build the signed Release app for iPhone
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$OUT"
          root="$GITHUB_WORKSPACE"
          started=$(date +%s)
          set -o pipefail
          xcodebuild -project SpokenMarginsNative.xcodeproj -scheme SpokenMarginsApp -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" -clonedSourcePackagesDirPath "$SPM" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$CAS" COMPILATION_CACHE_LIMIT_SIZE=1G \
            SWIFT_ENABLE_PREFIX_MAPPING=YES SWIFT_ENABLE_PROJECT_PREFIX_MAPPING=YES \
            CLANG_ENABLE_PREFIX_MAPPING=YES CLANG_ENABLE_PROJECT_PREFIX_MAPPING=YES \
            SWIFT_OTHER_PREFIX_MAPPINGS="\"$root=/^tree\"" CLANG_OTHER_PREFIX_MAPPINGS="\"$root=/^tree\"" \
            "SM_BUILD_COMMIT=$GITHUB_SHA" build 2>&1 | tee "$OUT/build.log" | grep -E 'error:|BUILD|cacheable tasks' || true
          grep -q 'BUILD SUCCEEDED' "$OUT/build.log"
          echo "BUILD_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"

      # The same checks scripts/phone-build makes before a build reaches the installer.
      - name: Check the app
        run: |
          app="$DERIVED/Build/Products/Release-iphoneos/$APP_NAME"
          [ -f "$app/embedded.mobileprovision" ] || { echo "::error::$APP_NAME has no provisioning profile; a phone would refuse it."; exit 1; }
          codesign --verify --strict "$app"
          commit=$(/usr/libexec/PlistBuddy -c 'Print :SMBuildCommit' "$app/Info.plist" 2>/dev/null || true)
          [ -z "$commit" ] || [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::The app says it was built from $commit, not $GITHUB_SHA."; exit 1; }
          security cms -D -i "$app/embedded.mobileprovision" > "$OUT/profile.plist"
          echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$OUT/profile.plist"), $(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$OUT/profile.plist" | grep -c -- '-') devices, expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$OUT/profile.plist")" | tee -a "$GITHUB_STEP_SUMMARY"
          rm "$OUT/profile.plist"
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "COMMIT_IN_APP=$commit" >> "$GITHUB_ENV"

      - name: Package
        run: |
          ditto -c -k --keepParent "$APP" "$OUT/$APP_NAME.zip"
          python3 - <<'PY'
          import datetime, json, os, plistlib, subprocess
          sha = os.environ['GITHUB_SHA']
          app = os.environ['APP']
          info = plistlib.load(open(os.path.join(app, 'Info.plist'), 'rb'))
          size = int(subprocess.check_output(['du', '-sk', app]).split()[0]) * 1024
          details = {
              'sha': sha, 'sha7': sha[:7],
              'subject': subprocess.check_output(['git', 'log', '-1', '--format=%s', sha], text=True).strip(),
              'built_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
              'build_seconds': int(os.environ['BUILD_SECONDS']), 'app': os.environ['APP_NAME'], 'app_bytes': size,
              'bundle_version': info.get('CFBundleVersion'), 'commit_in_app': os.environ.get('COMMIT_IN_APP') or None,
              'built_on': 'github-hosted', 'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          open(os.path.join(os.environ['OUT'], 'build.json'), 'w').write(json.dumps(details, indent=2) + '\n')
          print(f"Build {details['bundle_version']} from {sha[:7]}, {size / 1e6:.0f} MB, built in {details['build_seconds']} s.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: phone-build-${{ github.sha }}
          path: |
            .build/phone-out/SpokenMarginsApp.app.zip
            .build/phone-out/build.json
            .build/phone-out/build.log
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/dev-cert.p12" Config/Local.xcconfig
          security delete-keychain "$RUNNER_TEMP/phone-signing.keychain-db" 2>/dev/null || true

      - name: Report time
        if: always()
        run: |
          [ -n "${STARTED:-}" ] || exit 0
          echo "phone-build took $(( $(date +%s) - STARTED ))s on xcode-27 (Xcode 27.0)." | tee -a "$GITHUB_STEP_SUMMARY"
